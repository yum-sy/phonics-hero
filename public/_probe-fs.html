  // ======================================================================
  // QA round 2: pick-then-confirm, tap-to-continue combine, bolt fx
  // ======================================================================

  // Walks to a stage's first beat of a given kind and hands the beat back,
  // rendered. Same shape as toFirstBuild() below, generalised.
  async function toFirstBeat(chapterId, stageIndex, stage, kind, sel) {
    const bi = stage.beats.findIndex((b) => b.kind === kind)
    if (bi < 0) throw new Error(`${stage.id} has no ${kind} beat`)
    state.clearCheckpoint()
    await enterStage(chapterId, stageIndex)
    await walkBeats(stage, 0, bi)
    await until(sel)
    return stage.beats[bi]
  }

  const selectedIds = () =>
    [...document.querySelectorAll('.option-btn.selected')].map((b) => b.dataset.id)

  const feedbackText = () =>
    (document.getElementById('beat-feedback') || {}).textContent || ''

  // Speech redemonstrateOption() will produce for a beat/step: its own
  // promptAudio when it has one, else the correct option's own sound.
  const expectedHintSay = (beatOrStep) => {
    if (beatOrStep.promptAudio) return beatOrStep.promptAudio
    const c = beatOrStep.options.find((o) => o.correct)
    return c.say || c.label
  }

  // --- the whole point of the change: an option tap is NOT an answer -------
  // The silent failure to fear is the opposite of the old one: if the confirm
  // button is what scores, a beat that never accepts the confirmation stalls
  // forever, and one that scores on BOTH paths is the accidental-win bug
  // still shipping. Both are asserted here on a real scored beat.
  async function confirmGate() {
    const stage = chapters[0].stages[0]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBeat('chapter-1', 0, stage, 'choose', '.options-grid')
      obs.beat = beat.id
      obs.scored = !!beat.scored
      const before = instruction()
      const confirm = () => document.getElementById('confirm-btn')
      obs.confirmPresent = !!confirm()
      obs.disabledWithNoPick = confirm().disabled
      // Pressing it with nothing selected must be inert, not a wrong answer.
      confirm().click()
      await wait(400)
      obs.feedbackAfterEmptyConfirm = feedbackText()
      obs.hpBefore = healthPct()
      // Tap every option twice, the correct one included -- the exact
      // exploring a 5-year-old does, which used to answer for them.
      for (let round = 0; round < 2; round++) {
        for (const o of beat.options) {
          await pick(o.id)
          await wait(200)
        }
      }
      await wait(1500)
      obs.sameBeat = instruction() === before
      obs.hpAfterTaps = healthPct()
      obs.noDamageFromTaps = obs.hpAfterTaps === obs.hpBefore
      obs.readAloudLeaked = !!document.querySelector('.readaloud-beat')
      // Single-select: exactly one option is held, never a growing set.
      obs.selectedAfterTaps = selectedIds().length
      // A tap must not judge anything, so nothing may be shaking.
      obs.shakenByTaps = document.querySelectorAll('.option-btn.shake').length
      // ...and now the confirmation does answer. Drain first: the correct
      // branch waits on whenAudioIdle() by design, and the taps above (plus
      // whatever an earlier case left queued in a full sweep) put a real
      // backlog in front of it -- without this the poll below times out on
      // the queue, not on the app.
      await audio.whenAudioIdle()
      const correct = beat.options.find((o) => o.correct)
      await pick(correct.id)
      obs.enabledWithPick = !confirm().disabled
      await confirmPick()
      obs.movedOn =
        (await until('.readaloud-beat', 150)) || instruction() !== before
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'confirm-button-is-the-only-answer',
      !threw &&
        errors === 0 &&
        obs.confirmPresent === true &&
        obs.disabledWithNoPick === true &&
        obs.feedbackAfterEmptyConfirm === '' &&
        obs.sameBeat === true &&
        obs.noDamageFromTaps === true &&
        obs.readAloudLeaked === false &&
        obs.selectedAfterTaps === 1 &&
        obs.shakenByTaps === 0 &&
        obs.enabledWithPick === true &&
        obs.movedOn === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- confirming a WRONG pick: costs nothing, clears, still winnable -----
  async function confirmWrong() {
    const stage = chapters[0].stages[0]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBeat('chapter-1', 0, stage, 'choose', '.options-grid')
      const wrongs = beat.options.filter((o) => !o.correct)
      const correct = beat.options.find((o) => o.correct)
      obs.wrongOptions = wrongs.length
      obs.hpBefore = healthPct()
      await pick(wrongs[0].id)
      obs.selectedBeforeConfirm = selectedIds()
      await confirmPick()
      await wait(600)
      obs.hpAfterWrongConfirm = healthPct()
      obs.costNothing = obs.hpAfterWrongConfirm === obs.hpBefore
      obs.stillOnRound = !!document.querySelector('.options-grid')
      obs.leakedToReadAloud = !!document.querySelector('.readaloud-beat')
      obs.selectionCleared = selectedIds().length === 0
      obs.confirmDisabledAgain = document.getElementById('confirm-btn').disabled
      obs.feedback = feedbackText()
      // Second wrong confirmation in a row: the same rescue every other beat
      // has -- replay the sound and pulse the right answer, never place it.
      spoken = []
      await pick((wrongs[1] || wrongs[0]).id)
      await confirmPick()
      obs.redemonstrated = await waitForSpeech(
        (sp) => sp.includes(expectedHintSay(beat)),
        6000
      )
      let pulsed = false
      for (let i = 0; i < 40 && !pulsed; i++) {
        pulsed = !!document.querySelector('.option-btn.hint-pulse')
        if (!pulsed) await wait(50)
      }
      obs.pulsed = pulsed
      obs.stillOnRoundAfterRescue = !!document.querySelector('.options-grid')
      // and it is still winnable afterwards
      await answer(correct.id)
      obs.reachedReadAloud = await until('.readaloud-beat', 60)
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'confirm-wrong-costs-nothing-and-rescues',
      !threw &&
        errors === 0 &&
        obs.selectedBeforeConfirm.length === 1 &&
        obs.costNothing === true &&
        obs.stillOnRound === true &&
        obs.leakedToReadAloud === false &&
        obs.selectionCleared === true &&
        obs.confirmDisabledAgain === true &&
        obs.feedback !== '' &&
        obs.redemonstrated === true &&
        obs.pulsed === true &&
        obs.stillOnRoundAfterRescue === true &&
        obs.reachedReadAloud === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- multiselect is judged on the SET, not tap by tap -------------------
  async function multiConfirm() {
    const stage = chapters[0].stages[0]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBeat('chapter-1', 0, stage, 'multiselect', '.multiselect-beat')
      const correct = beat.options.filter((o) => o.correct)
      const wrong = beat.options.filter((o) => !o.correct)
      obs.beat = beat.id
      obs.correctCount = correct.length
      obs.hpBefore = healthPct()
      // 1. touching a WRONG option no longer gives the answer away
      await pick(wrong[0].id)
      obs.wrongPickSelected = selectedIds().includes(wrong[0].id)
      obs.wrongPickShaken = document.querySelectorAll('.option-btn.shake').length
      // 2. confirming it is wrong, and only the wrong pick is dropped
      await confirmPick()
      await wait(500)
      obs.afterWrongConfirm = selectedIds()
      obs.feedbackWrong = feedbackText()
      obs.hpAfterWrongConfirm = healthPct()
      // 3. an INCOMPLETE but all-correct set keeps what the child had
      await pick(correct[0].id)
      await confirmPick()
      await wait(500)
      obs.afterIncompleteConfirm = selectedIds()
      obs.keptCorrectPick = obs.afterIncompleteConfirm.includes(correct[0].id)
      obs.feedbackIncomplete = feedbackText()
      obs.leaked = !!document.querySelector('.readaloud-beat')
      // 4. the full set confirms
      for (const o of correct.slice(1)) {
        await pick(o.id)
        await wait(120)
      }
      await confirmPick()
      obs.reachedReadAloud = await until('.readaloud-beat', 80)
      await clickWhenEnabled('#mic-btn')
      await wait(600)
      obs.hpAfterHit = healthPct()
      obs.damageLanded = obs.hpAfterHit < obs.hpBefore
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'multiselect-judged-on-the-whole-set',
      !threw &&
        errors === 0 &&
        obs.wrongPickSelected === true &&
        obs.wrongPickShaken === 0 &&
        obs.afterWrongConfirm.length === 0 &&
        obs.hpAfterWrongConfirm === obs.hpBefore &&
        obs.keptCorrectPick === true &&
        obs.feedbackIncomplete === '아직 더 있어요!' &&
        obs.leaked === false &&
        obs.reachedReadAloud === true &&
        obs.damageLanded === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- THE silent-failure check for this change --------------------------
  // Moving the scoring point to a new button is exactly the shape of change
  // that ends with a boss whose health never reaches 0 -- and it fails
  // quietly, since every individual beat still looks like it worked. Play
  // whole stages where EVERY option-grid round is first answered WRONG
  // through the confirm button, then answered right, and assert the bar
  // still lands on 0% and the reward screen still paints.
  async function confirmHealthStages() {
    const targets = [
      [0, 4], // chapter 1 boss (choose + multiselect + drag-build + finale)
      [3, 3], // c4-stage-4 -- the app's only match-shape beat
      [6, 4], // chapter 7 boss (digraph)
    ]
    const rows = []
    for (const [ci, si] of targets) {
      const chapter = chapters[ci]
      const stage = chapter.stages[si]
      errors = 0
      state.clearCheckpoint()
      let threw = null
      let minHp = null
      let wrongConfirms = 0
      const sampler = setInterval(() => {
        const p = healthPct()
        if (p !== null && (minHp === null || p < minHp)) minHp = p
      }, 40)
      try {
        await enterStage(chapter.id, si)
        for (let bi = 0; bi < stage.beats.length; bi++) {
          const beat = stage.beats[bi]
          if (beat.kind === 'choose' || beat.kind === 'match-shape') {
            await until('.options-grid')
            const wrong = beat.options.find((o) => !o.correct)
            if (wrong) {
              wrongConfirms += 1
              await pick(wrong.id)
              await confirmPick()
              await wait(300)
              if (!document.querySelector('.options-grid')) {
                throw new Error(
                  `beat[${bi}] ${beat.id}: a WRONG confirmation ended the round`
                )
              }
            }
            await answer(beat.options.find((o) => o.correct).id)
          } else if (beat.kind === 'multiselect') {
            await until('.options-grid')
            const wrong = beat.options.find((o) => !o.correct)
            if (wrong) {
              wrongConfirms += 1
              await pick(wrong.id)
              await confirmPick()
              await wait(300)
            }
            for (const o of beat.options.filter((o) => o.correct)) {
              await pick(o.id)
              await wait(120)
            }
            await confirmPick()
          } else if (beat.kind === 'choose-sequence') {
            for (const step of beat.steps) {
              const wrong = step.options.find((o) => !o.correct)
              if (wrong) {
                wrongConfirms += 1
                await pick(wrong.id)
                await confirmPick()
                await wait(300)
              }
              await answer(step.options.find((o) => o.correct).id)
              await wait(150)
            }
          } else {
            await walkBeats(stage, bi, bi + 1)
            continue
          }
          if (beat.scored && beat.readAloud) await clickWhenEnabled('#mic-btn')
          await wait(200)
        }
        await until('.reward-screen', 80)
      } catch (e) {
        threw = e.message || String(e)
      }
      clearInterval(sampler)
      const reached = !!document.querySelector('.reward-screen')
      rows.push({
        stage: stage.id,
        wrongConfirms,
        minHealthPct: minHp,
        reachedReward: reached,
        errors,
        threw,
        ok: !threw && errors === 0 && reached && minHp === 0 && wrongConfirms > 0,
      })
      state.clearCheckpoint()
    }
    const bad = rows.filter((r) => !r.ok)
    check(
      'confirm-flow-health-still-reaches-zero',
      bad.length === 0,
      JSON.stringify(rows)
    )
  }

  // --- the confirm button is extra vertical furniture ---------------------
  // It lands on the app's tightest screens. Measure, per real option count,
  // in whatever orientation the window is set to.
  async function confirmFit() {
    const out = document.getElementById('out')
    const prev = out.style.display
    out.style.display = 'none'
    const de = document.documentElement
    const rows = []
    let threw = null
    try {
      const probes = [
        ['chapter-1', 0, chapters[0].stages[0], 'choose', '.options-grid'],
        ['chapter-1', 0, chapters[0].stages[0], 'multiselect', '.options-grid'],
        ['chapter-4', 3, chapters[3].stages[3], 'match-shape', '.options-grid'],
        ['chapter-1', 3, chapters[0].stages[3], 'choose-sequence', '.options-grid'],
      ]
      for (const [cid, si, stage, kind, sel] of probes) {
        await toFirstBeat(cid, si, stage, kind, sel)
        await wait(150)
        const grid = document.querySelector('.options-grid')
        const btn = document.getElementById('confirm-btn')
        const measure = (label) => ({
          probe: label,
          options: grid.querySelectorAll('.option-btn').length,
          confirmH: btn ? Math.round(btn.getBoundingClientRect().height) : null,
          confirmW: btn ? Math.round(btn.getBoundingClientRect().width) : null,
          // ovfY alone cannot see a control pushed past the fold: nothing in
          // the beat column clips, so a button sitting below the viewport
          // would still report scrollHeight == clientHeight if its parent's
          // own box ends earlier. The button's own bottom edge is the check
          // that matters -- it is the one the child has to reach.
          confirmBottom: btn ? Math.round(btn.getBoundingClientRect().bottom) : null,
          vh: window.innerHeight,
          confirmOffscreenBy: btn
            ? Math.max(0, Math.round(btn.getBoundingClientRect().bottom) - window.innerHeight)
            : 0,
          gridH: Math.round(grid.getBoundingClientRect().height),
          ovfY:
            Math.max(de.scrollHeight, document.body.scrollHeight) -
            window.innerHeight,
          ovfX:
            Math.max(de.scrollWidth, document.body.scrollWidth) -
            window.innerWidth,
        })
        rows.push(measure(kind))
        // Headroom probe: clone options up to 5 (the ceiling the elastic grid
        // was built for) and re-measure with the confirm button present.
        const first = grid.querySelector('.option-btn')
        while (grid.querySelectorAll('.option-btn').length < 5) {
          const c = first.cloneNode(true)
          c.dataset.id = 'pad-' + grid.children.length
          grid.appendChild(c)
        }
        await wait(150)
        rows.push(measure(kind + '+padded5'))
        state.clearCheckpoint()
      }
    } catch (e) {
      threw = e.message || String(e)
    }
    out.style.display = prev
    const bad = rows.filter(
      (r) => r.ovfY > 0 || r.ovfX > 0 || r.confirmOffscreenBy > 0
    )
    check(
      'confirm-button-does-not-scroll',
      !threw && bad.length === 0,
      `${window.innerWidth}x${window.innerHeight} threw=${threw} ${JSON.stringify(rows)}`
    )
    state.clearCheckpoint()
  }

  // --- combine intro waits for a tap ------------------------------------
  async function combineNeedsTap() {
    const chapter = chapters[0]
    const si = chapter.stages.findIndex((s) => s.chapterBoss)
    const beat = chapter.stages[si].beats[0]
    errors = 0
    let threw = null
    const obs = {}
    try {
      state.clearCheckpoint()
      await enterStage(chapter.id, si)
      obs.introRendered = await until('#boss-intro', 60)
      const hidden = () => {
        const c = document.getElementById('teach-content')
        return !!c && c.style.display === 'none'
      }
      obs.teachHiddenAtStart = hidden()
      // Well past the 1650ms auto-reveal this used to have.
      await wait(4000)
      obs.introStillUp = !!document.getElementById('boss-intro')
      obs.teachStillHidden = hidden()
      // The invite: layout's wobble class on the final form, plus the hint.
      obs.inviteOnFinalForm = !!document.querySelector(
        '.boss-intro-hero.combine-invite'
      )
      const hint = document.getElementById('boss-intro-hint')
      obs.hintVisible =
        !!hint && getComputedStyle(hint).visibility === 'visible'
      // Tap three times: the double-execution guard is the only thing left
      // between an excited 5-year-old and wireTeachButtons() running twice
      // (which would double up the auto-played teach audio).
      spoken = []
      const intro = document.getElementById('boss-intro')
      intro.click()
      intro.click()
      intro.click()
      await wait(400)
      obs.introRemoved = !document.getElementById('boss-intro')
      obs.inviteGone = !document.querySelector('.combine-invite')
      obs.teachRevealed = !hidden()
      const firstItem = (beat.repeatAudio || [])[0]
      obs.firstTeachItem = firstItem
      await waitForSpeech((sp) => sp.includes(firstItem), 8000)
      await wait(1200)
      obs.timesSpoken = spoken.filter((t) => t === firstItem).length
      // and the beat is still finishable
      obs.continueWorks = await clickWhenEnabled('#continue-btn')
      obs.movedOn = await until('.beat:not(.teach-beat), .options-grid', 60)
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'combine-waits-for-a-tap',
      !threw &&
        errors === 0 &&
        obs.introRendered === true &&
        obs.teachHiddenAtStart === true &&
        obs.introStillUp === true &&
        obs.teachStillHidden === true &&
        obs.inviteOnFinalForm === true &&
        obs.hintVisible === true &&
        obs.introRemoved === true &&
        obs.inviteGone === true &&
        obs.teachRevealed === true &&
        obs.timesSpoken === 1,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- reward screen: no stars, and the victory-staging hooks are there ---
  async function rewardParts() {
    const stage = chapters[0].stages[1]
    const saved = stage.beats
    stage.beats = [saved[0], saved[saved.length - 1]]
    const words = saved[saved.length - 1].words
    const out = document.getElementById('out')
    const prevDisp = out.style.display
    let threw = null
    const obs = {}
    try {
      out.style.display = 'none'
      state.clearCheckpoint()
      await enterStage('chapter-1', 1)
      await clickWhenEnabled('#continue-btn')
      await until('.listen-beat')
      for (let i = 0; i < words.length; i++) {
        await clickWhenEnabled('#mic-btn')
        await wait(400)
      }
      obs.reachedReward = await until('.reward-screen', 80)
      obs.starRows = document.querySelectorAll('.stars-row').length
      obs.stars = document.querySelectorAll('.star').length
      obs.starGlyphs = (
        document.querySelector('.reward-screen').textContent.match(/★/g) || []
      ).length
      const victor = document.querySelector('.reward-victor')
      const defeated = document.querySelector('.reward-defeated')
      obs.victors = document.querySelectorAll('.reward-victor').length
      obs.defeateds = document.querySelectorAll('.reward-defeated').length
      // The hooks must be on the right sprites, or layout's staging would
      // put the villain in the winner's pose.
      obs.victorIsHero = !!victor && victor.classList.contains('reward-hero')
      obs.defeatedIsVillain =
        !!defeated && defeated.classList.contains('reward-villain')
      const de = document.documentElement
      obs.ovfY =
        Math.max(de.scrollHeight, document.body.scrollHeight) -
        window.innerHeight
      obs.ovfX =
        Math.max(de.scrollWidth, document.body.scrollWidth) - window.innerWidth
      // progress.stars is still written (nothing reads it yet, but the clear
      // must keep banking one -- see the comment in renderReward).
      obs.starsPersisted = state.progress.stars[stage.id]
    } catch (e) {
      threw = e.message || String(e)
    }
    out.style.display = prevDisp
    stage.beats = saved
    check(
      'reward-has-no-stars-and-carries-victory-hooks',
      !threw &&
        obs.reachedReward === true &&
        obs.starRows === 0 &&
        obs.stars === 0 &&
        obs.starGlyphs === 0 &&
        obs.victors === 1 &&
        obs.defeateds === 1 &&
        obs.victorIsHero === true &&
        obs.defeatedIsVillain === true &&
        obs.ovfY <= 0 &&
        obs.ovfX <= 0 &&
        obs.starsPersisted === 3,
      `threw=${threw} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- the bolt: contract shape, self-cleanup, and off the critical path --
  async function boltFx() {
    const stage = chapters[0].stages[0]
    errors = 0
    let threw = null
    const obs = {}
    let injected = null
    try {
      const beat = await toFirstBeat('chapter-1', 0, stage, 'choose', '.options-grid')
      const correct = beat.options.find((o) => o.correct)
      const villain = document.getElementById('villain-sprite')
      const vr = villain.getBoundingClientRect()
      await pick(correct.id)
      const confirmRect = document
        .getElementById('confirm-btn')
        .getBoundingClientRect()
      // fireBolt() runs synchronously inside the confirm handler, before its
      // first await -- so the element exists the moment the click returns.
      document.getElementById('confirm-btn').click()
      const bolt = document.querySelector('body > .fx-bolt')
      obs.present = !!bolt
      if (bolt) {
        obs.parentIsBody = bolt.parentElement === document.body
        obs.pointerEvents = bolt.style.pointerEvents
        const p = (k) => bolt.style.getPropertyValue(k)
        obs.props = {
          x1: p('--fx-x1'), y1: p('--fx-y1'), x2: p('--fx-x2'), y2: p('--fx-y2'),
        }
        obs.allPx = Object.values(obs.props).every((v) => /^-?\d+px$/.test(v))
        const n = (k) => parseFloat(p(k))
        // Endpoint 1 = the pressed button's centre, endpoint 2 = the villain.
        obs.startsAtButton =
          Math.abs(n('--fx-x1') - (confirmRect.left + confirmRect.width / 2)) <= 1 &&
          Math.abs(n('--fx-y1') - (confirmRect.top + confirmRect.height / 2)) <= 1
        obs.endsAtVillain =
          Math.abs(n('--fx-x2') - (vr.left + vr.width / 2)) <= 1 &&
          Math.abs(n('--fx-y2') - (vr.top + vr.height / 2)) <= 1
      }
      // No --fx-bolt-ms in style.css yet (layout is writing it in parallel):
      // the fallback has to clean up, or every correct answer leaks a node.
      let goneAfter = null
      for (let i = 0; i < 60; i++) {
        if (!document.querySelector('.fx-bolt')) { goneAfter = i * 50; break }
        await wait(50)
      }
      obs.removedAfterMs = goneAfter
      obs.selfCleaned = goneAfter !== null
      // The decoration must not gate the beat.
      obs.beatAdvanced = await until('.readaloud-beat', 80)
      obs.leakedNodes = document.querySelectorAll('.fx-bolt').length

      // Now the other half of the contract: when layout DOES declare a
      // duration, that is the lifetime used.
      injected = document.createElement('style')
      injected.textContent = '.fx-bolt{--fx-bolt-ms:150ms}'
      document.head.appendChild(injected)
      await clickWhenEnabled('#mic-btn')
      const bolt2 = document.querySelector('body > .fx-bolt')
      obs.secondBoltPresent = !!bolt2
      let gone2 = null
      for (let i = 0; i < 40; i++) {
        if (!document.querySelector('.fx-bolt')) { gone2 = i * 25; break }
        await wait(25)
      }
      obs.declaredDurationRespected = gone2 !== null && gone2 < 600
      obs.removedAfterMsDeclared = gone2
    } catch (e) {
      threw = e.message || String(e)
    }
    if (injected) injected.remove()
    check(
      'fx-bolt-contract-and-cleanup',
      !threw &&
        errors === 0 &&
        obs.present === true &&
        obs.parentIsBody === true &&
        obs.pointerEvents === 'none' &&
        obs.allPx === true &&
        obs.startsAtButton === true &&
        obs.endsAtVillain === true &&
        obs.selfCleaned === true &&
        obs.beatAdvanced === true &&
        obs.leakedNodes === 0 &&
        obs.secondBoltPresent === true &&
        obs.declaredDurationRespected === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- damage lands WHEN the bolt lands, not 392ms before it ---------------
  //
  // The half of the bolt work that was still inverted: fireBolt() and
  // dealHit() ran in the same tick, so `hit-shake` + 💥 + the health bar all
  // finished BEFORE the bolt reached the villain -- the exact cause/effect
  // reversal the bolt was added to fix. It cannot be checked from a
  // screenshot: both orderings paint identical pixels a second later. What is
  // checkable is the ORDER of DOM mutations against a measured clock, which
  // is what these cases do.
  //
  // They exist mostly for the failure in the OTHER direction: schedule the
  // paint wrong and the health bar never moves, the boss never reaches 0, and
  // nothing throws while it happens.

  const healthWidth = () => {
    const el = document.getElementById('health-fill')
    return el ? el.style.width : null
  }
  const sparkCount = () => document.querySelectorAll('.hit-spark').length
  const hasShake = () =>
    !!document.querySelector('.villain-sprite.hit-shake')
  const hasLunge = () => !!document.querySelector('.hero-sprite.hero-lunge')
  // DIAGNOSTIC ONLY -- DO NOT ASSERT ON THIS. `hit-shake` is never taken off
  // the sprite after the animation ends, so the class only means "was ever
  // hit in this stage", and the obvious fix -- ask for a *running* animation
  // instead -- does not work here: under --virtual-time-budget the document
  // timeline does not advance, so this reported `running` for a 0.4s
  // animation that had ended more than a second earlier (measured, it is why
  // seqbolt asserts on the spark instead). The reliable "it flinched just
  // now" signal in this harness is `.hit-spark`, which is a real DOM node
  // created by villainImpact() and removed by a setTimeout.
  const shakeRunning = () => {
    const el = document.querySelector('.villain-sprite')
    if (!el || !el.getAnimations) return null
    return el
      .getAnimations()
      .some((a) => a.animationName === 'hit-shake' && a.playState === 'running')
  }

  // Clicks with NO await between the poll and the click, so the caller
  // observes the DOM inside the same task the handler's synchronous part ran
  // in. clickWhenEnabled() awaits, and a microtask boundary is enough for a
  // 0ms-scheduled paint to have already happened -- which would hide exactly
  // the difference these cases measure.
  async function clickNow(sel) {
    for (let i = 0; i < 200; i++) {
      const el = document.querySelector(sel)
      if (el && !el.disabled) {
        el.click()
        return true
      }
      await wait(50)
    }
    return false
  }

  // Polls until pred() and reports how long that took. Measured on the clock
  // AND on iteration count: under --virtual-time-budget the two are not the
  // same thing, so a frozen performance.now() would otherwise read as "it
  // landed instantly" -- a false PASS. Both go in the extra string.
  async function msUntilTrue(pred, maxMs = 4000, step = 8) {
    const t0 = performance.now()
    let polls = 0
    while (performance.now() - t0 < maxMs) {
      if (pred()) break
      polls += 1
      await wait(step)
    }
    return { ms: Math.round(performance.now() - t0), polls, hit: !!pred() }
  }

  // Walks chapter-1 stage-1 to its first scored beat (beat 1: choose +
  // readAloud) and stops on the read-aloud screen, whose 🎤 is the damage
  // moment. Beat 1 is chosen because it is the stage's FIRST hit -- nothing
  // has left a stale `hit-shake`/`hero-lunge` class on a sprite yet, so the
  // absence of a flinch is meaningful.
  async function toFirstDamageMoment() {
    const stage = chapters[0].stages[0]
    const beat = stage.beats[1]
    state.clearCheckpoint()
    await enterStage('chapter-1', 0)
    await clickWhenEnabled('#continue-btn')
    await until('.options-grid')
    await answer(beat.options.find((o) => o.correct).id)
    await until('.readaloud-beat')
    await wait(700) // let any earlier spark/flinch expire before measuring
    // Draining is load-bearing for the critical-path comparison, not tidiness.
    // waitForTransition(500) is max(audio drain, 500ms), so a backlog left by
    // an EARLIER CASE stretches the transition: measured 943ms in a full-suite
    // run against 510ms in isolation, which read as "the flight is on the
    // critical path" -- a failure with no app bug behind it. Both runs have to
    // start from an empty queue for the flight to be the only variable.
    await audio.whenAudioIdle()
    return beat
  }

  // One damage moment, fully instrumented. Returns the ordering observations
  // plus how long the beat transition took, so a caller can compare the
  // transition against a different flight time and see whether the flight is
  // on the critical path.
  async function measureDamageMoment() {
    const o = {}
    o.healthBefore = healthWidth()
    o.shakeBefore = hasShake()
    o.sparksBefore = sparkCount()
    // Everything below is timed from the PRESS, not from the previous
    // measurement -- measuring the transition from the moment the bar moved
    // is what makes a slower flight look like a faster transition, which is
    // the shape of a false PASS on the critical-path question.
    const pressedAt = performance.now()
    const clicked = await clickNow('#mic-btn')
    o.clicked = clicked
    // Same task as the handler's synchronous half.
    o.boltPresentAtPress = !!document.querySelector('body > .fx-bolt')
    o.boltCountAtPress = document.querySelectorAll('.fx-bolt').length
    o.healthAtPress = healthWidth()
    o.healthHeldAtPress = o.healthAtPress === o.healthBefore
    o.shakeAtPress = hasShake()
    // The hero's lunge is the THROW, so unlike the flinch it must be
    // immediate -- delaying it with the rest would only move the inversion
    // onto the hero (throwing after its own bolt has landed).
    o.lungeAtPress = hasLunge()
    o.sparksAtPress = sparkCount()
    // "Hit! 💥" is a claim about the villain, so it must not be on screen
    // while the bolt is still crossing it.
    o.feedbackAtPress = (document.getElementById('beat-feedback') || {}).textContent
    const landed = await msUntilTrue(() => healthWidth() !== o.healthBefore)
    o.landedMs = landed.ms
    o.landedPolls = landed.polls
    o.healthMoved = landed.hit
    o.healthAfter = healthWidth()
    // The flinch and the burst must arrive with the bar, not before it.
    o.shakeAfter = hasShake()
    o.sparksAfter = sparkCount()
    o.feedbackAfter = (document.getElementById('beat-feedback') || {}).textContent
    const gone = await msUntilTrue(() => !document.querySelector('.readaloud-beat'))
    o.transitionMs = Math.round(performance.now() - pressedAt)
    o.transitioned = gone.hit
    return o
  }

  async function boltSync() {
    errors = 0
    let threw = null
    const obs = {}
    let injected = null
    try {
      // The contract itself. The fallback in screens.js is deliberately 0ms
      // (a hold with no bolt to explain it is dead time in front of a
      // 5-year-old), which means a renamed/removed variable would silently
      // restore the bug instead of breaking anything -- this assertion is
      // what makes that loud.
      const declared = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue(
          '--fx-bolt-flight-ms'
        )
      )
      obs.declaredFlightMs = declared
      obs.contractDeclared = Number.isFinite(declared) && declared > 0

      await toFirstDamageMoment()
      const real = await measureDamageMoment()
      obs.real = real
      // Generous window: the assertion is "after the bolt, before the round
      // ends", not "exactly 392". A tight bound would fail every time layout
      // retunes the animation, which is theirs to retune.
      obs.heldForFlight =
        real.healthHeldAtPress === true &&
        real.shakeAtPress === false &&
        real.sparksAtPress === 0 &&
        real.lungeAtPress === true &&
        real.healthMoved === true &&
        real.shakeAfter === true &&
        real.sparksAfter >= 1 &&
        real.feedbackAtPress === '' &&
        real.feedbackAfter === 'Hit! 💥' &&
        real.landedMs >= declared * 0.6 &&
        real.landedMs <= declared + 250

      // Half the contract is that the VALUE is used, not that some delay
      // exists -- a hard-coded 392 would pass everything above.
      injected = document.createElement('style')
      injected.textContent = '.fx-bolt{--fx-bolt-flight-ms:150ms}'
      document.head.appendChild(injected)
      await toFirstDamageMoment()
      const short = await measureDamageMoment()
      obs.short = short
      obs.declaredValueHonoured =
        short.healthHeldAtPress === true &&
        short.healthMoved === true &&
        short.landedMs < real.landedMs - 100

      // ...and that the hold is NOT on the critical path. Same beat, same
      // audio, only the flight differs -- both measured press-to-transition.
      // If the transition were gated on the bolt, the 392ms run would finish
      // ~242ms later than the 150ms run. It does not: waitForTransition(500)
      // is what both are waiting on, and the flight fits inside it.
      obs.transitionDeltaMs = real.transitionMs - short.transitionMs
      obs.transitionUnaffected =
        real.transitioned === true &&
        short.transitioned === true &&
        Math.abs(obs.transitionDeltaMs) < 120 &&
        // A transition shorter than the flight would mean the bar painted
        // into a screen that was already gone.
        real.transitionMs > real.landedMs
    } catch (e) {
      threw = e.message || String(e)
    }
    if (injected) injected.remove()
    check(
      'damage-lands-with-the-bolt',
      !threw &&
        errors === 0 &&
        obs.contractDeclared === true &&
        obs.heldForFlight === true &&
        obs.declaredValueHonoured === true &&
        obs.transitionUnaffected === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- both bad directions of the flight value ----------------------------
  // A malformed value must cost NOTHING (fall straight through to the old
  // synchronous behaviour) and an absurd one must not push the paint past
  // the end of the round -- every damage site is followed by
  // waitForTransition(500), so an unclamped 5s flight would drop the health
  // bar onto the *next* beat's screen.
  async function boltFlightFallback() {
    errors = 0
    let threw = null
    const obs = {}
    let injected = null
    try {
      injected = document.createElement('style')
      injected.textContent = '.fx-bolt{--fx-bolt-flight-ms:banana}'
      document.head.appendChild(injected)
      await toFirstDamageMoment()
      const bad = await measureDamageMoment()
      obs.bad = bad
      // Fallback is 0: the paint happens in the click's own task, so it is
      // already done by the time the first poll runs.
      obs.malformedCostsNothing =
        bad.healthHeldAtPress === false &&
        bad.shakeAtPress === true &&
        bad.healthMoved === true &&
        bad.landedMs <= 40

      injected.textContent = '.fx-bolt{--fx-bolt-flight-ms:5000ms}'
      await toFirstDamageMoment()
      const huge = await measureDamageMoment()
      obs.huge = huge
      // Clamped to FX_FLIGHT_MAX_MS (450), so it still lands inside the
      // round rather than after it.
      obs.hugeClamped =
        huge.healthHeldAtPress === true &&
        huge.healthMoved === true &&
        huge.landedMs <= 700 &&
        huge.shakeAfter === true
    } catch (e) {
      threw = e.message || String(e)
    }
    if (injected) injected.remove()
    check(
      'bolt-flight-value-fails-safe-both-ways',
      !threw &&
        errors === 0 &&
        obs.malformedCostsNothing === true &&
        obs.hugeClamped === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- choose-sequence: the one damage moment with no fireBolt() call -----
  //
  // Reported as "the health bar drops with no connection to the button". It
  // is subtler than that: wireConfirmGrid fires a bolt from ✓ Check on EVERY
  // step, last one included, so there was always a bolt in the air -- the
  // damage just wasn't riding it. Fix = schedule the hit on that bolt's
  // arrival, NOT fire a second one (two identical bolts on the same path in
  // the same tick reads as a rendering glitch, not as two events).
  //
  // So this checks all three: every step still signals with a bolt, the last
  // step has exactly ONE bolt, and the bar waits for it.
  async function seqBolt() {
    const stage = chapters[0].stages[3] // c1 stage-4, beat 9 = choose-sequence
    errors = 0
    let threw = null
    const obs = {}
    try {
      const bi = stage.beats.findIndex((b) => b.kind === 'choose-sequence')
      if (bi < 0) throw new Error('stage-4 has no choose-sequence beat')
      const beat = stage.beats[bi]
      obs.steps = beat.steps.length
      state.clearCheckpoint()
      await enterStage('chapter-1', 3)
      await walkBeats(stage, 0, bi)
      await until('.options-grid')
      await wait(700) // outlive any spark from the previous beat's hit

      const boltsPerStep = []
      let last = null
      for (let s = 0; s < beat.steps.length; s++) {
        const isLast = s === beat.steps.length - 1
        const step = beat.steps[s]
        await pick(step.options.find((o) => o.correct).id)
        const healthBefore = healthWidth()
        const sparksBefore = sparkCount()
        await clickNow('#confirm-btn')
        boltsPerStep.push(document.querySelectorAll('.fx-bolt').length)
        if (isLast) {
          last = {
            healthBefore,
            sparksBefore,
            healthAtPress: healthWidth(),
            // Class, not animation: beat 8 already hit this villain, so the
            // class is stale by design here -- see shakeRunning().
            shakeClassAtPress: hasShake(),
            shakeRunningAtPress: shakeRunning(),
            sparksAtPress: sparkCount(),
          }
          const landed = await msUntilTrue(
            () => healthWidth() !== healthBefore
          )
          last.landedMs = landed.ms
          last.healthMoved = landed.hit
          last.sparksAfter = sparkCount()
          last.shakeRunningAfter = shakeRunning()
          last.healthAfter = healthWidth()
        } else {
          await wait(200)
          // A non-final step deals no damage at all -- that is the rule the
          // "bolt = correct answer" signal rests on.
          obs.midStepDealtNoDamage =
            (obs.midStepDealtNoDamage !== false) &&
            healthWidth() === healthBefore &&
            sparkCount() === sparksBefore
          await wait(400)
        }
      }
      obs.boltsPerStep = boltsPerStep
      obs.last = last
      obs.everyStepFiredABolt = boltsPerStep.every((n) => n >= 1)
      // Exactly one, not two: no second bolt was added for the damage.
      obs.lastStepFiredExactlyOne = boltsPerStep[boltsPerStep.length - 1] === 1
      // The spark is the load-bearing signal: 0 at the press, 1 after the
      // flight = villainImpact() ran on arrival, not on the press. (Neither
      // the class nor getAnimations() can tell you that here -- see
      // shakeRunning().)
      obs.lastStepHeldForFlight =
        last.healthAtPress === last.healthBefore &&
        last.sparksAtPress === last.sparksBefore &&
        last.sparksBefore === 0 &&
        last.healthMoved === true &&
        last.sparksAfter >= 1 &&
        last.landedMs >= 200 &&
        last.landedMs <= 700
      obs.beatAdvanced = await until('.finale, .listen-beat', 60)
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'choose-sequence-damage-rides-its-own-bolt',
      !threw &&
        errors === 0 &&
        obs.everyStepFiredABolt === true &&
        obs.lastStepFiredExactlyOne === true &&
        obs.midStepDealtNoDamage === true &&
        obs.lastStepHeldForFlight === true &&
        obs.beatAdvanced === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- taps fire on PRESS, and the paired click does not double-fire ------
  // The regression this guards is subtle: bind both pointerdown and click
  // without a guard and every real touch runs the handler twice, which on a
  // toggle (option select) looks like the button not working at all.
  async function pointerTap() {
    const stage = chapters[0].stages[0]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBeat('chapter-1', 0, stage, 'choose', '.options-grid')
      const id = beat.options[0].id
      const btn = document.querySelector(`[data-id="${id}"]`)
      const fire = (type) =>
        btn.dispatchEvent(
          new PointerEvent(type, {
            bubbles: true,
            pointerType: 'touch',
            isPrimary: true,
          })
        )
      const sel = () => btn.classList.contains('selected')
      // 1. immediacy: the press alone already selects, before any release.
      fire('pointerdown')
      await wait(200)
      obs.selectedByPressAlone = sel()
      // 2. finishing that SAME touch the way a browser does -- pointerup and
      //    then click -- must not run the handler a second time and toggle it
      //    straight back off. A long hold is the case a pointerdown-relative
      //    window got wrong, so hold well past PAIRED_CLICK_MS before lifting.
      await wait(1400)
      fire('pointerup')
      btn.click()
      await wait(200)
      obs.oneActivationPerLongPress = sel()
      // 3. a genuine SECOND touch must still get through -- swallowing repeat
      //    taps here would hide the double-tap guards other cases rely on.
      fire('pointerdown')
      fire('pointerup')
      btn.click()
      await wait(200)
      obs.secondTouchToggledOff = !sel()
      // 4. and a click with no pointer events at all (both harnesses drive the
      //    app this way, as do keyboard and assistive tech) still activates,
      //    once the paired-click window from the touch above has lapsed.
      await wait(900)
      btn.click()
      await wait(200)
      obs.bareClickWorks = sel()
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'tap-fires-on-press-without-double-firing',
      !threw &&
        errors === 0 &&
        obs.selectedByPressAlone === true &&
        obs.oneActivationPerLongPress === true &&
        obs.secondTouchToggledOff === true &&
        obs.bareClickWorks === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // --- touch target census ------------------------------------------------
  // QA said the buttons respond badly; size is one of the two candidates
  // (the other, event timing, is what pointerTap covers). style.css is not
  // this agent's file, so this measures and names anything under the 88px
  // floor rather than fixing it.
  const TOUCH_FLOOR = 88

  // .back-btn is exempt, and deliberately so: style.css says in as many words
  // that it is "an adult navigation affordance, not learning content" and is
  // held down on purpose (measured 190x47 / 110x47 in portrait), because at
  // learning-content size it cost 87px off the top of every screen. A child
  // being able to hit "exit" less easily is the intent, not a defect -- so
  // this floor applies to the controls the CHILD is meant to hit, and the
  // back buttons are reported as data instead.
  const TOUCH_EXEMPT = '.back-btn'

  async function touchTargets() {
    const out = document.getElementById('out')
    const prevDisp = out.style.display
    out.style.display = 'none'
    const rows = []
    let threw = null
    const scan = (screen) => {
      const sel =
        'button, [role="button"], .option-btn, .letter-tile, .stage-node, .chapter-card'
      for (const el of document.querySelectorAll(sel)) {
        const r = el.getBoundingClientRect()
        if (!r.width || !r.height) continue
        const w = Math.round(r.width)
        const h = Math.round(r.height)
        rows.push({
          screen,
          el:
            (el.id && '#' + el.id) ||
            '.' + (el.className || '').toString().split(/\s+/)[0],
          w,
          h,
          exempt: el.matches(TOUCH_EXEMPT),
          small: !el.matches(TOUCH_EXEMPT) && Math.min(w, h) < TOUCH_FLOOR,
        })
      }
    }
    try {
      state.clearCheckpoint()
      screens.renderWorldSelect()
      await until('.chapter-card')
      scan('world')
      screens.renderMap('chapter-1')
      await until('.stage-node')
      scan('map')
      const stage = chapters[0].stages[0]
      await toFirstBeat('chapter-1', 0, stage, 'choose', '.options-grid')
      scan('choose')
      await toFirstBeat('chapter-1', 4, chapters[0].stages[4], 'drag-build', '.build-slots')
      scan('build')
    } catch (e) {
      threw = e.message || String(e)
    }
    out.style.display = prevDisp
    const small = rows.filter((r) => r.small)
    const exempt = rows.filter((r) => r.exempt)
    check(
      'touch-targets-meet-88px-floor',
      !threw && small.length === 0,
      `${window.innerWidth}x${window.innerHeight} threw=${threw} ` +
        `under=${JSON.stringify(small)} exempt=${JSON.stringify(exempt)} ` +
        `all=${JSON.stringify(rows)}`
    )
    state.clearCheckpoint()
  }

  // --- baked phoneme assets -----------------------------------------------
  // The sounds the child imitates are no longer synthesised: audio.js plays a
  // generated WAV from public/snd/ when one exists for the exact string, and
  // falls back to TTS for everything else. These cases exist because that
  // introduces a second playback path into a queue whose entire value is the
  // "one sound at a time" invariant, and because its failure mode -- an asset
  // that does not play and does not fall back -- is SILENCE, which is the one
  // thing the user has already reported and the hardest thing to see in a
  // transcript-based harness.
  //
  // HOW THE ASSET PATH IS REACHED HERE, and why it is not reached by accident.
  // Headless Chrome starts every AudioContext suspended and its resume() never
  // settles without a user gesture (measured: still pending after 3000ms) --
  // which is exactly why audio.js must not await resume(), and it means all the
  // other cases in this file run the TTS fallback unchanged. To exercise the
  // asset path, these cases shadow `state` on AudioContext.prototype so the
  // already-created context reports 'running'. That is a lie about audibility
  // only: fetch, decodeAudioData, the real buffer durations and the real queue
  // are all genuine.
  //
  // Observation is by patching AudioBufferSourceNode.prototype.start rather
  // than by any hook inside audio.js. A test-only seam in the module would be
  // a thing that can rot without failing; a real API cannot.
  let sndPlays = []

  function sndPatch({ forceRunning = true, breakSource = false } = {}) {
    const CtxProto = (window.AudioContext || window.webkitAudioContext).prototype
    const NodeProto = window.AudioBufferSourceNode.prototype
    const hadOwnState = Object.prototype.hasOwnProperty.call(CtxProto, 'state')
    const origStart = NodeProto.start
    const origCreate = CtxProto.createBufferSource
    sndPlays = []
    if (forceRunning) {
      Object.defineProperty(CtxProto, 'state', {
        get: () => 'running',
        configurable: true,
      })
    }
    if (breakSource) {
      CtxProto.createBufferSource = function () {
        throw new Error('simulated createBufferSource failure')
      }
    }
    NodeProto.start = function (...args) {
      sndPlays.push({
        at: Date.now(),
        ms: this.buffer ? Math.round(this.buffer.duration * 1000) : -1,
      })
      return origStart.apply(this, args)
    }
    return () => {
      NodeProto.start = origStart
      CtxProto.createBufferSource = origCreate
      // `state` lives on BaseAudioContext.prototype, so deleting the shadow
      // restores the real getter. Only delete a shadow we installed.
      if (forceRunning && !hadOwnState) delete CtxProto.state
    }
  }

  // Assets are ~260-480ms and TTS here is a 120ms stub, so a real overlap
  // shows up as hundreds of ms. This absorbs only timer scheduling jitter.
  const SND_SLOP_MS = 60

  // audio.js decodes assets in the background and never awaits a load in the
  // play path, so the first request for a cold key is spoken instead. These
  // cases therefore have to get the cache warm before they assert on it.
  //
  // wait() CANNOT be used to wait for that, and this is the second virtual-time
  // trap in this file. Under --virtual-time-budget a setTimeout fires as fast
  // as the budget allows, so `await wait(500)` costs ~0ms of REAL time -- and
  // fetch + decodeAudioData are real work on real threads, so they have not
  // finished. Awaiting an actual fetch is what yields real time; each one is a
  // sub-millisecond round trip against the dev server, so this is a real-time
  // pump, not a sleep.
  //
  // It returns whether the cache actually came up, and every caller asserts on
  // that: a silent "warm-up never happened" would turn all four of these cases
  // into vacuous passes.
  async function sndWarm() {
    audio.unlockAudio() // idempotent; kicks warmSoundAssets() if it can
    let plays = 0
    for (let i = 0; i < 300; i++) {
      await fetch('/sounds/manifest.json')
      const restore = sndPatch()
      audio.speakEN('sss')
      await audio.whenAudioIdle()
      plays = sndPlays.length
      restore()
      if (plays > 0) return true
    }
    return false
  }

  async function sndQueue() {
    let threw = null
    const obs = {}
    obs.warm = await sndWarm()
    const restore = sndPatch()
    try {
      spoken = []
      audio.clearAudioQueue()
      const t0 = Date.now()
      // Fired without awaiting, which is the shape that used to overlap: three
      // call sites racing into one queue.
      audio.speakEN('sss')
      audio.speakEN('tuh')
      audio.speakEN('cat')
      await audio.whenAudioIdle()
      obs.elapsed = Date.now() - t0
      obs.plays = sndPlays.map((p) => ({ ms: p.ms, at: p.at - t0 }))
      obs.spoken = spoken.slice()
      // sss and tuh have assets; cat does not.
      obs.assetsPlayed = sndPlays.length
      obs.assetMs = sndPlays.map((p) => p.ms)
      // Compared against the MANIFEST, not against literals. These durations
      // are natural phoneme lengths and they move whenever a source word is
      // re-picked; two hardcoded numbers here would fail the next regeneration
      // for no reason, and the interesting property is "the queue played the
      // shipped file", not "the file is 155ms".
      const mf = (await (await fetch('/sounds/manifest.json')).json()).sounds
      obs.expectMs = [mf.sss.ms, mf.tuh.ms]
      obs.msMatchManifest =
        obs.assetMs.length === 2 &&
        obs.assetMs[0] === mf.sss.ms &&
        obs.assetMs[1] === mf.tuh.ms
      obs.notSpokenByTts = !spoken.includes('sss') && !spoken.includes('tuh')
      obs.wordWentToTts = spoken.includes('cat')
      // The invariant: nothing starts before the previous thing stopped
      // sounding, and MIN_GAP_MS of silence sits between them.
      let worstGap = Infinity
      for (let i = 1; i < sndPlays.length; i++) {
        const gap = sndPlays[i].at - (sndPlays[i - 1].at + sndPlays[i - 1].ms)
        worstGap = Math.min(worstGap, gap)
      }
      obs.worstAssetGap = worstGap === Infinity ? null : worstGap
      obs.noOverlap = worstGap === Infinity || worstGap >= -SND_SLOP_MS
      obs.gapHeld = worstGap === Infinity || worstGap >= 500 - SND_SLOP_MS
    } catch (e) {
      threw = e.message || String(e)
    }
    restore()
    check(
      'asset-sounds-play-through-the-queue-without-overlap',
      !threw &&
        obs.warm === true &&
        obs.assetsPlayed === 2 &&
        obs.msMatchManifest === true &&
        obs.notSpokenByTts === true &&
        obs.wordWentToTts === true &&
        obs.noOverlap === true &&
        obs.gapHeld === true,
      `threw=${threw} ${JSON.stringify(obs)}`
    )
  }

  async function sndFallback() {
    let threw = null
    const obs = {}
    obs.warm = await sndWarm()
    const restore = sndPatch()
    try {
      spoken = []
      audio.clearAudioQueue()
      // A word, a LETTER NAME, and Korean. None has an asset, and the middle
      // one is the trap: lowercasing before the lookup (which is what the TTS
      // path does before speaking) would make 'A' hit a.wav and replace an
      // intended letter name with the AI vowel sound.
      audio.speakEN('cat')
      audio.speakEN('A')
      audio.speakKO('잘했어')
      await audio.whenAudioIdle()
      obs.plays = sndPlays.map((p) => p.ms)
      obs.spoken = spoken.slice()
      obs.noAssets = sndPlays.length === 0
      obs.allSpoken = ['cat', 'a', '잘했어'].every((t) => spoken.includes(t))
    } catch (e) {
      threw = e.message || String(e)
    }
    restore()
    check(
      'assetless-strings-including-letter-names-still-go-to-tts',
      !threw && obs.warm === true && obs.noAssets === true && obs.allSpoken === true,
      `threw=${threw} ${JSON.stringify(obs)}`
    )
  }

  async function sndNoSilence() {
    let threw = null
    const obs = {}
    obs.warm = await sndWarm()
    try {
      // (a) context not running -- the real state of every other case in this
      //     file, asserted explicitly rather than assumed.
      const r1 = sndPatch({ forceRunning: false })
      spoken = []
      audio.clearAudioQueue()
      audio.speakEN('sss')
      await audio.whenAudioIdle()
      obs.suspendedPlays = sndPlays.length
      obs.suspendedSpoke = spoken.includes('sss')
      r1()
      // (b) running context, but the source node cannot be created. This is
      //     the route that used to report "played" and produce nothing.
      const r2 = sndPatch({ breakSource: true })
      spoken = []
      audio.clearAudioQueue()
      audio.speakEN('sss')
      await audio.whenAudioIdle()
      obs.brokenPlays = sndPlays.length
      obs.brokenSpoke = spoken.includes('sss')
      r2()
      // (c) and with nothing broken it really is the asset, so (a) and (b)
      //     above are not passing because the asset path is simply dead.
      const r3 = sndPatch()
      spoken = []
      audio.clearAudioQueue()
      audio.speakEN('sss')
      await audio.whenAudioIdle()
      obs.healthyPlays = sndPlays.length
      obs.healthySpoke = spoken.includes('sss')
      r3()
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'every-asset-failure-route-falls-back-to-tts-never-silence',
      !threw &&
        obs.warm === true &&
        obs.suspendedPlays === 0 &&
        obs.suspendedSpoke === true &&
        obs.brokenPlays === 0 &&
        obs.brokenSpoke === true &&
        obs.healthyPlays === 1 &&
        obs.healthySpoke === false,
      `threw=${threw} ${JSON.stringify(obs)}`
    )
  }

  // The key set is hardcoded in audio.js so the first sound costs no round
  // trip, which means it can drift from what the generator actually wrote --
  // and drift is invisible at runtime: a key audio.js has forgotten just goes
  // quietly back to being spoken as a letter name. This is the only place that
  // ever notices.
  async function sndManifest() {
    let threw = null
    const obs = {}
    // Progress breadcrumb. This case has hung twice on virtual-time behaviour
    // rather than on anything it was testing, and a hang writes no verdict at
    // all -- so it leaves a trail that says how far it got.
    const trace = (s) => {
      document.documentElement.dataset.sndTrace =
        (document.documentElement.dataset.sndTrace || '') + s + ' '
    }
    try {
      trace('start')
      const manifest = await (await fetch('/sounds/manifest.json')).json()
      trace('manifest')
      const src = await (await fetch(sameAsApp('audio.js'))).text()
      trace('src')
      const m = src.match(/SOUND_ASSETS\s*=\s*new Set\(\[([\s\S]*?)\]\)/)
      const declared = m
        ? [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1])
        : []
      const sounds = manifest.sounds || {}
      obs.ext = manifest.ext
      obs.declared = declared.length
      obs.generated = Object.keys(sounds).length
      // Every sound must name the WORD it was cut from. That field is what
      // makes a verdict in the listening gallery mean something -- "the /s/ is
      // wrong" is unactionable without knowing it came from "sun".
      obs.missingSource = Object.entries(sounds)
        .filter(([, v]) => !v.source || !v.pos)
        .map(([k]) => k)
      // NOTHING MAY BE LENGTHENED. A build that padded every non-plosive to a
      // 260ms target passed every check this harness had and was rejected on
      // the real device -- "마치 양이 메에에에에 하는 것 같아" -- because
      // repeating a pitch period freezes the formants. It was only diagnosable
      // by noticing from the outside that every disliked sound was exactly
      // 260ms, so the manifest now carries naturalMs/stretch and this asserts
      // on them. `stretch: 1.0` on all 25 lines is the standing evidence.
      obs.stretched = Object.entries(sounds)
        .filter(([, v]) => v.stretch !== 1 || v.naturalMs !== v.ms)
        .map(([k, v]) => `${k} ${v.naturalMs}->${v.ms} x${v.stretch}`)
      // A regex that stopped matching would report an empty set as "no
      // difference", which is the false-pass shape this project keeps hitting.
      obs.parsed = declared.length >= 20
      obs.missingFromAudioJs = Object.keys(sounds).filter((k) => !declared.includes(k))
      obs.missingFromDisk = declared.filter((k) => sounds[k] == null)
      // Every declared asset must really fetch and really decode, at the
      // duration the generator measured. A 404 or a truncated file would
      // otherwise only show up as a sound quietly reverting to TTS.
      // The bytes are verified by PARSING THE WAV HEADER, not by handing them
      // to decodeAudioData, and that is a measurement, not a shortcut.
      // Sequential decodeAudioData stops resolving after ~19 calls under
      // --virtual-time-budget (probed: 17 succeed, then a 2000ms race times
      // out; reordering the keys moves the stall, so it is a decoder resource
      // limit, not a bad file), and moving them into one Promise.all only
      // moved the stall -- this case hung twice on it and a hang writes no
      // verdict at all. Reading the header is also the stricter check: it pins
      // channels, sample rate, bit depth and the real PCM length, where a
      // decode only reports a duration. That the browser can actually decode
      // and play these is proven by sndqueue/sndnosilence going through
      // audio.js's own path.
      const wav = (ab) => {
        const dv = new DataView(ab)
        const tag = (o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1),
                                               dv.getUint8(o + 2), dv.getUint8(o + 3))
        if (tag(0) !== 'RIFF' || tag(8) !== 'WAVE') return { err: 'not RIFF/WAVE' }
        let off = 12
        let fmt = null
        while (off + 8 <= dv.byteLength) {
          const id = tag(off)
          const size = dv.getUint32(off + 4, true)
          if (id === 'fmt ') {
            fmt = {
              ch: dv.getUint16(off + 10, true),
              rate: dv.getUint32(off + 12, true),
              bits: dv.getUint16(off + 22, true),
            }
          } else if (id === 'data' && fmt) {
            return { ...fmt, ms: Math.round(size / (fmt.rate * fmt.ch * fmt.bits / 8) * 1000) }
          }
          off += 8 + size + (size % 2)
        }
        return { err: 'no data chunk' }
      }
      const raw = await Promise.all(
        declared.map(async (key) => {
          const res = await fetch(`/sounds/${key}.${manifest.ext}`)
          return [key, res.ok, res.ok ? await res.arrayBuffer() : null]
        })
      )
      trace('fetched')
      obs.undecodable = raw
        .map(([key, ok, ab]) => {
          if (!ok) return key + ' http-error'
          const w = wav(ab)
          if (w.err) return `${key} ${w.err}`
          if (w.ch !== 1 || w.bits !== 16) return `${key} ${w.ch}ch/${w.bits}bit`
          if (Math.abs(w.ms - sounds[key].ms) > 5) {
            return `${key} ${w.ms}ms != manifest ${sounds[key].ms}ms`
          }
          return null
        })
        .filter(Boolean)
      trace('verified')
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'sound-asset-manifest-matches-audio-js-and-every-file-is-valid-pcm',
      !threw &&
        obs.parsed === true &&
        obs.declared === obs.generated &&
        obs.missingSource.length === 0 &&
        obs.stretched.length === 0 &&
        obs.missingFromAudioJs.length === 0 &&
        obs.missingFromDisk.length === 0 &&
        obs.undecodable.length === 0,
      `threw=${threw} ${JSON.stringify(obs)}`
    )
  }

  // ---- reviewTargets consumer (screens.js's withGeneratedReview /
  // buildGeneratedReviewBeat) ----
  //
  // reviewTargets has had zero consumers since it was introduced -- this is
  // the first case that reads it. There is no chapter 9 yet to exercise the
  // generator through real play (it only activates for chapter.order > 8),
  // so this calls the exported pure functions directly: real chapter 1-8
  // data proves the "stay off" gates hold against production data, and a
  // synthetic chapter/stage -- built only in this function, never
  // registered anywhere -- proves the generation logic itself is sound.
  async function reviewGeneratedQuickfire() {
    let threw = null
    const obs = {}
    try {
      // Gate 1: a REAL chapter-8 stage (order <= 8) must come back with the
      // exact same object reference, even though it declares reviewTargets
      // -- chapters 1-8 keep exactly the beats they ship today. Uses the
      // default `chapter` param (real getChapterForStage lookup), not an
      // override, so this exercises the actual production call path.
      const c8s4 = chapters
        .find((c) => c.order === 8)
        .stages.find((s) => s.reviewTargets)
      obs.gate1SameReference = screens.withGeneratedReview(c8s4) === c8s4

      // Gate 2: a synthetic chapter with order > 8 whose reviewTargets stage
      // ALREADY has a hand-authored choose-sequence beat must also come
      // back unchanged -- a future author can opt out per-stage.
      const handAuthoredStage = {
        id: 'synthetic-handauthored',
        reviewTargets: ['S', 'A', 'T', 'Z'],
        beats: [{ kind: 'choose-sequence', steps: [] }],
      }
      const fakeChapter9 = {
        order: 9,
        stages: [
          { beats: [{ kind: 'teach', letter: 'Z' }] },
          handAuthoredStage,
        ],
      }
      obs.gate2SameReference =
        screens.withGeneratedReview(handAuthoredStage, fakeChapter9) ===
        handAuthoredStage

      // The actual generation path: a synthetic chapter 9 teaching G and B
      // (new), reviewing everything chapters 1-8 really taught (old) -- built
      // from the REAL cumulative reviewTargets list so this exercises the
      // real SOUND_TABLE lookups. G and B both have a CONFUSION_GROUPS
      // partner (C, P) already in that real list, so this exercises the
      // interference-pair path, not just its fallback.
      const realTaughtSoFar = c8s4.reviewTargets
      const stage9 = {
        id: 'synthetic-c9-stage',
        reviewTargets: [...realTaughtSoFar, 'G', 'B'],
        beats: [
          { kind: 'teach', letter: 'G' },
          { kind: 'teach', letter: 'B' },
          { kind: 'finale', words: ['bag'] },
        ],
      }
      const chapter9 = { order: 9, stages: [stage9] }
      const withReview = screens.withGeneratedReview(stage9, chapter9)
      obs.injected = withReview !== stage9
      obs.beatCountGrew = withReview.beats.length === stage9.beats.length + 1
      const injectedIndex = withReview.beats.findIndex(
        (b) => b.kind === 'choose-sequence'
      )
      obs.insertedBeforeLastBeat = injectedIndex === withReview.beats.length - 2
      const beat = withReview.beats[injectedIndex]
      obs.stepCount = beat.steps.length
      obs.scored = beat.scored === true

      // No option grid may pair two options with the same `say` (C/K's
      // "one sound, two letterforms") or a known collision pair (a/eh's
      // "two sounds, one rendered waveform") -- the two failure modes a
      // hand-authored beat is protected from by validateChapters(), which
      // never runs on this beat since it's built at render time, not in
      // chapters/index.js.
      const collisionPairs = [['buh', 'duh'], ['a', 'eh']]
      let sameSayTwice = false
      let collisionPairFound = false
      let everySaySet = true
      let exactlyOneCorrectPerStep = true
      for (const step of beat.steps) {
        const says = step.options.map((o) => o.say)
        if (says.some((s) => !s)) everySaySet = false
        if (new Set(says).size !== says.length) sameSayTwice = true
        for (const [x, y] of collisionPairs) {
          if (says.includes(x) && says.includes(y)) collisionPairFound = true
        }
        if (step.options.filter((o) => o.correct).length !== 1) {
          exactlyOneCorrectPerStep = false
        }
      }
      obs.noSameSoundTwice = !sameSayTwice
      obs.noCollisionPair = !collisionPairFound
      obs.everySaySet = everySaySet
      obs.exactlyOneCorrectPerStep = exactlyOneCorrectPerStep

      // The whole point of consuming reviewTargets instead of just quizzing
      // this chapter's own letters: at least one step's correct answer has
      // to be a grapheme from BEFORE this chapter.
      obs.hasCrossChapterStep = beat.steps.some((step) =>
        step.options.some((o) => o.correct && realTaughtSoFar.includes(o.label))
      )

      // stageHealthMax must see the generated beat too, or the health bar
      // would already be pinned at 0% before this beat's hit could land.
      obs.healthMaxIncludesGenerated =
        stageHealthMax(withReview) === stageHealthMax(stage9) + beat.hits

      // Calling it again on the same (stage, chapter) must reproduce the
      // identical step order -- seeded, not Math.random() -- so a retry
      // after the recovery panel shows the same round rather than a reshuffle.
      const again = screens.withGeneratedReview(stage9, chapter9)
      obs.deterministic =
        JSON.stringify(again.beats[injectedIndex]) === JSON.stringify(beat)

      // A stage with reviewTargets but nothing new to teach (no `teach`
      // beat at all in its chapter) must degrade to "no beat generated",
      // not throw.
      const emptyStage = {
        id: 'synthetic-empty',
        reviewTargets: ['S'],
        beats: [{ kind: 'finale', words: ['a'] }],
      }
      const emptyChapter = { order: 9, stages: [emptyStage] }
      obs.emptyChapterNoOp =
        screens.withGeneratedReview(emptyStage, emptyChapter) === emptyStage
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'review-quickfire-generated-from-reviewTargets',
      threw === null &&
        obs.gate1SameReference &&
        obs.gate2SameReference &&
        obs.injected &&
        obs.beatCountGrew &&
        obs.insertedBeforeLastBeat &&
        obs.scored &&
        obs.stepCount >= 2 &&
        obs.noSameSoundTwice &&
        obs.noCollisionPair &&
        obs.everySaySet &&
        obs.exactlyOneCorrectPerStep &&
        obs.hasCrossChapterStep &&
        obs.healthMaxIncludesGenerated &&
        obs.deterministic &&
        obs.emptyChapterNoOp,
      `threw=${threw} ${JSON.stringify(obs)}`
    )
  }

  const CASES = {
    worldheader: worldHeaderFit,
    tap: tapBacklog,
    poison: queuePoison,
    dbl: doubleTap,
    exit: exitDuringTransition,
    fail: renderFailureRecovery,
    unlock: devUnlock,
    corrupt: corruptProgress,
    exitreward: exitBeforeReward,
    failshot: failShot,
    cpexit: checkpointExit,
    cpwrite: checkpointWrite,
    cpresume: checkpointResume,
    screenfail: screenFailureRecovery,
    norecog: noRecognition,
    rewardshot: rewardShot,
    recapaudio: recapAudioOrder,
    matchshape: matchShapeNoSoundLeak,
    matchshapeshot: matchShapeShot,
    allstages: allStagesPlaythrough,
    matchshapereal: matchShapeRealShot,
    digraph: digraphRender,
    digraphshotchoose: digraphShotChoose,
    digraphshotteach: digraphShotTeach,
    ch7build: digraphBuildStage,
    ch7boss: digraphBossStageFull,
    ch7buildshot: ch7BuildShot,
    allbuilds: allBuildBeats,
    buildmismatch: buildMismatchGuard,
    buildwrong: buildWrongOrder,
    buildrescue: buildWrongRescue,
    buildwrongdigraph: buildWrongOrderDigraph,
    buildwrongstages: buildWrongOrderStages,
    buildwrongfit: buildWrongFit,
    shadow: shadowReveal,
    shadowshot: shadowShot,
    buildwrongshot: buildWrongShot,
    artscan: artCrashScan,
    onendearly: onendEarlyHypothesis,
    eqfit: equationFit,
    bosseq: bossEquations,
    eqdelta: eqHeightDelta,
    bosseqshot: bossEqShot,
    confirmgate: confirmGate,
    confirmwrong: confirmWrong,
    multiconfirm: multiConfirm,
    confirmhealth: confirmHealthStages,
    confirmfit: confirmFit,
    combinetap: combineNeedsTap,
    rewardparts: rewardParts,
    boltfx: boltFx,
    boltsync: boltSync,
    boltfallback: boltFlightFallback,
    seqbolt: seqBolt,
    pointertap: pointerTap,
    touchtargets: touchTargets,
    sndqueue: sndQueue,
    sndfallback: sndFallback,
    sndnosilence: sndNoSilence,
    sndmanifest: sndManifest,
    reviewgen: reviewGeneratedQuickfire,
  }

  const names = only ? only.split(',') : Object.keys(CASES)
  for (const n of names) {
    // An unknown ?only= name used to be skipped silently, which reported
    // "0/0 PASS" -- a typo read as a clean run. Make it a failure instead.
    if (!CASES[n]) {
      check(n, false, 'no such case')
      continue
    }
    try {
      await CASES[n]()
    } catch (e) {
      check(n, false, 'threw ' + e.message)
    }
  }
  const summary =
    results.filter((r) => r.startsWith('PASS')).length + '/' + results.length + ' PASS'
  document.getElementById('out').textContent = results.join('\n') + '\n' + summary
  document.title = 'RESULTS ' + summary
  document.documentElement.setAttribute('data-results', results.join(' | '))
</script>
