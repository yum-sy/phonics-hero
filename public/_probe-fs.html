<!doctype html>
<meta charset="utf-8" />
<title>fullstack probe</title>
<link rel="stylesheet" href="/src/style.css" />
<div id="app"></div>
<!-- margin:0 is load-bearing: a <pre> carries a 1em (14px) default margin
     top and bottom, and since .screen became `min-height: 100svh` that margin
     is 14px of page height the APP does not have. Every ovfY reading here was
     reporting it as an app overflow (digraph/bosseq both went red at once). -->
<pre id="out" style="margin:0;font:600 14px ui-monospace,monospace;white-space:pre-wrap"></pre>
<script type="module">
  // Behavioural harness for the fullstack agent's robustness fixes.
  // Separate from _probe.html (layout/screenshot harness owned by design 1)
  // so both can be edited without conflict.
  //
  // ---- HOW TO RUN IT, and the three ways it has lied ----
  //   CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  //   "$CH" --headless --disable-gpu --window-size=834,1281 \
  //     --virtual-time-budget=200000 --dump-dom \
  //     "http://localhost:5173/_probe-fs.html?only=onendearly" \
  //     | perl -ne 'print "$1\n" if /data-results="([^"]*)"/'
  // Read the verdict from `data-results` (or document.title). Every one of
  // these cost a misdiagnosis, so check them before believing a failure:
  //
  // (1) `?only=` IS ORDER-DEPENDENT, and the order is the order you type.
  //     Some cases set up state that a later case asserts on. `cpresume`
  //     without `cpwrite` reports
  //         FAIL checkpoint-survives-reload :: no checkpoint persisted
  //     which reads like a broken feature and is really a missing setup step:
  //     `?only=cpwrite,cpresume` passes both. When a case fails in isolation,
  //     re-run it with no `?only=` at all before believing it.
  //
  // (2) THE BUDGET IS VIRTUAL TIME, AND TOO SMALL LOOKS LIKE A HANG. When the
  //     budget runs out mid-run the page is simply frozen where it stood:
  //     `data-results` is never written at all, so the extractor prints
  //     nothing and it reads as "the harness hung". `allstages` walks all 35
  //     stages and needs --virtual-time-budget=3000000; at 200000 it produces
  //     no attribute. Measured: the 3000000 run finishes in 3.1s of WALL
  //     time -- virtual time is not wall time, so a big budget is nearly free
  //     and there is no reason to economise on it.
  //
  // (3) THERE IS NO `timeout` ON THIS MAC, and no `gtimeout` either (no
  //     coreutils). `timeout 200 "$CH" ...` does not run Chrome at all -- the
  //     shell exits 127, the pipeline prints nothing, and it looks exactly
  //     like symptom (2). Do not wrap the command; if a run really needs a
  //     wall-clock bound, background it and poll.
  const params = new URLSearchParams(location.search)
  const only = params.get('only')

  // Corrupt-progress case has to be prepared BEFORE state.js first loads,
  // because progress is read at module-init time.
  const KEY = 'carbot-phonics-progress-v1'
  if (params.get('corrupt') === '1') {
    localStorage.setItem(
      KEY,
      JSON.stringify({ clearedStages: 'not-an-array', stars: 7 })
    )
  } else if (params.get('legacy') === '1') {
    // Exactly the shape a pre-checkpoint build persisted.
    localStorage.setItem(
      KEY,
      JSON.stringify({ clearedStages: ['stage-1'], stars: { 'stage-1': 3 } })
    )
  } else if (params.get('keep') !== '1') {
    localStorage.removeItem(KEY)
  }
  const stored = () => JSON.parse(localStorage.getItem(KEY) || 'null')

  let errors = 0
  const errorLog = []
  const origConsoleError = console.error.bind(console)
  console.error = (...args) => {
    errorLog.push(args.map((a) => (a && a.stack ? a.stack : String(a))).join(' '))
    origConsoleError(...args)
  }
  window.addEventListener('error', () => { errors += 1 })
  window.addEventListener('unhandledrejection', () => { errors += 1 })

  // Realistic-but-fast TTS: resolves via onend like a real engine, and
  // records what actually got spoken.
  let spoken = []
  window.speechSynthesis.speak = (u) => {
    spoken.push(u.text)
    setTimeout(() => u.onend && u.onend(), 120)
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const results = []
  const check = (name, pass, extra = '') =>
    results.push(`${pass ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`)

  // Module identity matters here: Vite appends a cache-busting query to a
  // module it has seen change, so importing '/src/state.js' by hand can hand
  // back a SECOND instance whose `progress` object the app never reads --
  // silently testing a copy. Reuse the exact specifiers the transformed
  // screens.js imports, so the harness shares the app's instances.
  const screensSrc = await (await fetch('/src/screens.js')).text()
  const sameAsApp = (fragment) => {
    const m = screensSrc.match(
      new RegExp('from\\s*["\']([^"\']*' + fragment + '[^"\']*)["\']')
    )
    return m ? m[1] : '/src/' + fragment
  }
  const screens = await import('/src/screens.js')
  const audio = await import(sameAsApp('audio.js'))
  const state = await import(sameAsApp('state.js'))
  const { chapters, stageHealthMax } = await import(sameAsApp('stages.js'))

  async function enterStage(chapterId, stageIndex, keepCheckpoint = false) {
    if (!keepCheckpoint) state.clearCheckpoint()
    screens.renderMap(chapterId)
    await wait(80)
    document.querySelectorAll('.stage-node[data-stage]')[stageIndex].click()
    await wait(80)
  }

  async function until(sel, tries = 200) {
    for (let i = 0; i < tries; i++) {
      if (document.querySelector(sel)) return true
      await wait(100)
    }
    return false
  }

  // Buttons like #mic-btn/#continue-btn get reused by id across a beat's
  // own re-renders (disabled while its click is being processed, then a
  // fresh enabled one on the next word/step) -- matching on presence alone
  // can grab the stale disabled instance mid-transition. Poll for enabled
  // too, and click through the *live* element each time in case the node
  // was replaced between the check and the click.
  const slotsOf = (target) =>
    typeof target === 'string' ? target.split('') : target

  // Wait until the transcript satisfies a predicate. Fixed sleeps are wrong
  // here: audio.js holds every utterance for a measured minimum duration
  // (its defence against a lying onend), so total sequence time depends on
  // content length, not on how fast this harness's stub fires onend.
  async function waitForSpeech(pred, maxMs = 20000) {
    const step = 100
    for (let waited = 0; waited < maxMs; waited += step) {
      if (pred(spoken)) return true
      await wait(step)
    }
    return pred(spoken)
  }

  async function clickWhenEnabled(sel, tries = 200) {
    for (let i = 0; i < tries; i++) {
      const el = document.querySelector(sel)
      if (el && !el.disabled) {
        el.click()
        return true
      }
      await wait(100)
    }
    return false
  }

  // ---- pick-then-confirm ----
  // Option-grid beats (choose, match-shape, each choose-sequence step,
  // multiselect) no longer answer on the option tap: the tap selects and
  // speaks, "✓ Check" grades. Every walker in this file goes through these
  // two helpers, so a beat that stops accepting the confirmation shows up
  // once, here, rather than as 30 unrelated timeouts.
  async function pick(id) {
    await until(`[data-id="${id}"]`)
    document.querySelector(`[data-id="${id}"]`).click()
  }

  async function confirmPick() {
    return clickWhenEnabled('#confirm-btn')
  }

  async function answer(id) {
    await pick(id)
    return confirmPick()
  }

  const instruction = () =>
    (document.querySelector('.beat-instruction') || {}).textContent || ''

  // --- 1. repeat-tap backlog is bounded -------------------------------------
  async function tapBacklog() {
    audio.clearAudioQueue()
    spoken = []
    for (let i = 0; i < 6; i++) audio.speakTap('sun')
    await wait(4000)
    const coalesced = spoken.length
    audio.clearAudioQueue()
    spoken = []
    for (let i = 0; i < 6; i++) audio.speakEN('sun')
    await wait(6000)
    const control = spoken.length
    check(
      'tap-backlog-bounded',
      coalesced <= 2 && control === 6,
      `6 taps spoke ${coalesced} (content path still speaks ${control}/6)`
    )
  }

  // --- 2. a bad utterance must not poison the queue -------------------------
  async function queuePoison() {
    audio.clearAudioQueue()
    spoken = []
    audio.speakEN(undefined)
    audio.speakEN(null)
    audio.speakEN('')
    let idleResolved = false
    audio.whenAudioIdle().then(
      () => { idleResolved = true },
      () => { idleResolved = 'rejected' }
    )
    await wait(2000)
    audio.speakEN('recovered')
    await wait(3000)
    check(
      'queue-survives-bad-text',
      idleResolved === true && spoken.includes('recovered'),
      `whenAudioIdle=${idleResolved} spoken=${JSON.stringify(spoken)}`
    )
  }

  // --- 3. double-tapping the correct answer must not skip a beat ------------
  async function doubleTap() {
    const stage = chapters[0].stages[1] // beats: 0 teach, 1 choose (unscored), 2 choose(scored)
    const beat1 = stage.beats[1]
    const beat2 = stage.beats[2]
    const beat3 = stage.beats[3]
    await enterStage('chapter-1', 1)
    document.getElementById('continue-btn').click()
    await until('.choose-beat')
    const correctId = beat1.options.find((o) => o.correct).id
    // The double-fire risk moved with the grading: an option tap is now just
    // a selection (idempotent by construction), and "✓ Check" is the button
    // an excited 5-year-old hits three times. onTap() deliberately does NOT
    // swallow repeat taps -- the beat's own `settled` guard is what has to
    // hold, so hit it directly.
    await pick(correctId)
    const btn = document.getElementById('confirm-btn')
    btn.click()
    btn.click()
    btn.click()
    await wait(4000)
    const now = instruction()
    check(
      'double-tap-no-beat-skip',
      now === beat2.instructionKo,
      `landed on "${now.slice(0, 24)}" (expected beat2 "${beat2.instructionKo.slice(0, 24)}", skip would be "${beat3.instructionKo.slice(0, 24)}")`
    )
  }

  // --- 4. leaving mid-transition must not drag the child back ---------------
  async function exitDuringTransition() {
    const stage = chapters[0].stages[1]
    const beat1 = stage.beats[1]
    errors = 0
    await enterStage('chapter-1', 1)
    document.getElementById('continue-btn').click()
    await until('.choose-beat')
    const correctId = beat1.options.find((o) => o.correct).id
    await answer(correctId)
    document.getElementById('exit-stage').click()
    await wait(4000)
    const onMap = !!document.querySelector('.map-screen')
    const stageBack = !!document.querySelector('.stage-screen')
    const reward = !!document.querySelector('.reward-screen')
    check(
      'exit-during-transition-stays-on-map',
      onMap && !stageBack && !reward && errors === 0,
      `map=${onMap} stage=${stageBack} reward=${reward} errors=${errors}`
    )
  }

  // --- 5. a thrown beat renderer must leave working controls ----------------
  async function renderFailureRecovery() {
    errors = 0
    await enterStage('chapter-1', 1)
    // Corrupt the *next* beat the way a content bug would, then advance.
    const stage = chapters[0].stages[1]
    const saved = stage.beats[1]
    stage.beats[1] = { kind: 'choose', instructionKo: 'boom', options: null }
    document.getElementById('continue-btn').click()
    const recovered = await until('#retry-beat', 60)
    const canExit = !!document.getElementById('exit-stage')
    stage.beats[1] = saved
    // The retry button must also work once the content is sane again.
    let retried = false
    if (recovered) {
      document.getElementById('retry-beat').click()
      retried = await until('.choose-beat', 40)
    }
    check(
      'render-failure-has-escape',
      recovered && canExit && retried,
      `panel=${recovered} exitBtn=${canExit} retryWorks=${retried}`
    )
  }

  // --- 6. dev unlock still works for the parent ----------------------------
  async function devUnlock() {
    const stages = chapters.flatMap((c) => c.stages)
    const last = stages[stages.length - 1]
    check(
      'dev-unlock-active-in-dev',
      state.isStageUnlocked(stages, last.id) === true,
      `import.meta.env.DEV path unlocked ${last.id}`
    )
  }

  // --- 7. corrupt saved progress must still boot ---------------------------
  async function corruptProgress() {
    errors = 0
    screens.renderWorldSelect()
    await wait(200)
    const painted = !!document.querySelector('.chapter-grid')
    screens.renderMap('chapter-1')
    await wait(200)
    const mapPainted = document.querySelectorAll('.stage-node').length > 0
    check(
      'corrupt-progress-still-boots',
      painted && mapPainted && errors === 0,
      `world=${painted} map=${mapPainted} errors=${errors} progress=${JSON.stringify(state.progress)}`
    )
  }

  // --- 8. exiting during the FINAL transition must not paint the reward ----
  // The reward screen replaces #app wholesale (not just the beat area), so
  // this is the one path a stale continuation can visibly hijack.
  async function exitBeforeReward() {
    const stage = chapters[0].stages[1]
    const saved = stage.beats
    // Shorten the stage to teach -> finale so the last transition is reachable.
    stage.beats = [saved[0], saved[saved.length - 1]]
    const words = saved[saved.length - 1].words
    errors = 0
    localStorage.removeItem('carbot-phonics-progress-v1')
    try {
      await enterStage('chapter-1', 1)
      document.getElementById('continue-btn').click()
      await until('.listen-beat')
      for (let i = 0; i < words.length - 1; i++) {
        document.getElementById('mic-btn').click()
        await wait(2500)
      }
      document.getElementById('mic-btn').click()
      document.getElementById('exit-stage').click()
      await wait(5000)
      const reward = !!document.querySelector('.reward-screen')
      const onMap = !!document.querySelector('.map-screen')
      const banked = state.isStageCleared(stage.id)
      check(
        'exit-before-reward-not-hijacked',
        onMap && !reward && !banked && errors === 0,
        `map=${onMap} reward=${reward} clearBanked=${banked} errors=${errors}`
      )
    } finally {
      stage.beats = saved
    }
  }

  // Leaves the recovery panel on screen for a screenshot.
  async function failShot() {
    await enterStage('chapter-1', 1)
    const stage = chapters[0].stages[1]
    const saved = stage.beats[1]
    stage.beats[1] = { kind: 'choose', instructionKo: 'boom', options: null }
    document.getElementById('continue-btn').click()
    await until('#retry-beat', 60)
    check('failshot-rendered', !!document.getElementById('retry-beat'))
    // Restore so later cases in the same run don't inherit a broken beat;
    // the panel is already painted, so the screenshot is unaffected.
    stage.beats[1] = saved
    state.clearCheckpoint()
  }

  // --- (b) checkpoint: written while playing, erased on a deliberate exit ---
  async function checkpointExit() {
    const stage = chapters[0].stages[1]
    await enterStage('chapter-1', 1)
    document.getElementById('continue-btn').click()
    await until('.choose-beat')
    const midCp = (stored() || {}).checkpoint
    document.getElementById('exit-stage').click()
    await wait(400)
    const afterExit = (stored() || {}).checkpoint
    // Re-entering must start from beat 0 again.
    await enterStage('chapter-1', 1, true)
    const restarted = instruction() === stage.beats[0].instructionKo
    check(
      'checkpoint-erased-on-intentional-exit',
      !!midCp && midCp.beatIndex > 0 && afterExit === null && restarted,
      `whilePlaying=${JSON.stringify(midCp)} afterExit=${JSON.stringify(afterExit)} restartsAtBeat0=${restarted}`
    )
  }

  // Run 1 of the reload A/B: play a few beats, then just stop (an iPad going
  // to sleep or a tab reload -- no exit tap).
  async function checkpointWrite() {
    await enterStage('chapter-1', 1)
    document.getElementById('continue-btn').click()
    await until('.choose-beat')
    const cp = (stored() || {}).checkpoint
    check(
      'checkpoint-written-mid-stage',
      !!cp && cp.stageId === 'stage-2' && cp.beatIndex > 0,
      JSON.stringify(cp)
    )
  }

  // Run 2 of the reload A/B (same browser profile, fresh page load).
  async function checkpointResume() {
    const stage = chapters[0].stages[1]
    const cp = (stored() || {}).checkpoint
    if (!cp) {
      check('checkpoint-survives-reload', false, 'no checkpoint persisted')
      return
    }
    await enterStage('chapter-1', 1, true)
    await wait(300)
    const expected = stage.beats[cp.beatIndex].instructionKo
    const landed = instruction()
    check(
      'checkpoint-survives-reload',
      landed === expected && landed !== stage.beats[0].instructionKo,
      `resumed at beat ${cp.beatIndex} "${landed.slice(0, 20)}" (beat0 is "${stage.beats[0].instructionKo.slice(0, 20)}")`
    )
  }

  // --- (c) top-level screen failure keeps a working escape ---------------
  async function screenFailureRecovery() {
    errors = 0
    // An id with no world behind it is what a stale link or a bad lookup
    // produces, and it reaches the same throw a data-shape bug would.
    screens.renderChapterSelect('world-does-not-exist')
    await wait(200)
    const panel = !!document.getElementById('retry-beat')
    const escape = !!document.getElementById('failure-escape')
    const grid = !!document.querySelector('.chapter-grid')
    let escaped = false
    if (escape) {
      document.getElementById('failure-escape').click()
      await wait(200)
      escaped = !!document.querySelector('.chapter-grid')
    }
    check(
      'screen-failure-has-escape',
      panel && escape && escaped,
      `panel=${panel} escapeBtn=${escape} escapeWorks=${escaped} gridStillRendered=${grid}`
    )
  }

  // --- (a) no speech recognition is started any more ----------------------
  async function noRecognition() {
    let started = 0
    const Impl = window.SpeechRecognition || window.webkitSpeechRecognition
    if (Impl) {
      const orig = Impl.prototype.start
      Impl.prototype.start = function () {
        started += 1
        try { return orig.apply(this, arguments) } catch (e) {}
      }
    }
    await enterStage('chapter-1', 0)
    document.getElementById('continue-btn').click()
    await until('.choose-beat')
    const stage = chapters[0].stages[0]
    const correctId = stage.beats[1].options.find((o) => o.correct).id
    await answer(correctId)
    const gotMic = await until('#mic-btn', 60)
    if (gotMic) document.getElementById('mic-btn').click()
    await wait(2500)
    check(
      'no-speech-recognition-started',
      started === 0 && gotMic,
      `recognition.start() calls=${started} micButtonPresent=${gotMic}`
    )
  }

  // Leaves the reward screen on screen for a screenshot (shortens the stage
  // so the finale is two taps away).
  async function rewardShot() {
    const stage = chapters[0].stages[1]
    const saved = stage.beats
    stage.beats = [saved[0], saved[saved.length - 1]]
    const words = saved[saved.length - 1].words
    try {
      await enterStage('chapter-1', 1)
      document.getElementById('continue-btn').click()
      await until('.listen-beat')
      for (let i = 0; i < words.length; i++) {
        document.getElementById('mic-btn').click()
        await wait(2600)
      }
      await until('.reward-screen', 60)
      check('rewardshot-rendered', !!document.querySelector('.reward-screen'))
    } finally {
      stage.beats = saved
    }
  }

  // --- recapAudio: Korean explanation, then each English word/sound as its
  // own utterance, in that order, through the shared queue -----------------
  // Drives a stage to completion using the actual beat data (which option
  // is correct, what the build target is) rather than blindly clicking the
  // first available control -- a multiselect's wrong option never disables
  // itself, so a kind-blind walker can get stuck reclicking it forever.
  async function playThroughStage(stage) {
    return walkBeats(stage, 0, stage.beats.length)
  }

  async function walkBeats(stage, from, to) {
    for (let bi = from; bi < to; bi++) {
      const beat = stage.beats[bi]
      try {
      if (beat.kind === 'teach' || beat.kind === 'break') {
        // Chapter-boss stages open with a combine intro overlaying the
        // teach content; tap it so the sweep also exercises the skip path
        // instead of just waiting out its 1.65s timeout on every boss stage.
        const intro = document.getElementById('boss-intro')
        if (intro) intro.click()
        await clickWhenEnabled('#continue-btn')
      } else if (beat.kind === 'choose' || beat.kind === 'match-shape') {
        // Wait for THIS beat's specific correct-option id, not just any
        // '.options-grid' -- the previous beat's own transition (600ms +
        // whenAudioIdle) can still be in flight when this beat's own poll
        // starts, so a class-only selector can match the *outgoing* beat's
        // still-present grid and click into content that's about to be
        // torn down (data-id from the wrong beat -> querySelector returns
        // null -> "Cannot read properties of null (reading 'click')").
        const id = beat.options.find((o) => o.correct).id
        await answer(id)
      } else if (beat.kind === 'choose-sequence') {
        for (const step of beat.steps) {
          const id = step.options.find((o) => o.correct).id
          await answer(id)
          await wait(150)
        }
      } else if (beat.kind === 'multiselect') {
        await until('.options-grid')
        for (const opt of beat.options.filter((o) => o.correct)) {
          await pick(opt.id)
          await wait(150)
        }
        // One confirmation for the whole SET -- the round is judged on the
        // set, not on each tap.
        await confirmPick()
      } else if (beat.kind === 'drag-build') {
        await until('.build-slots')
        // Same normalisation the renderer does: a target is a list of
        // SLOTS, either a plain word or an explicit array whose entries can
        // be digraphs ('AI'). Splitting characters here would look for an
        // 'A' tile in a round whose only tile is 'AI'.
        for (const slot of slotsOf(beat.target)) {
          const tile = [...document.querySelectorAll('.letter-tile:not(:disabled)')].find(
            (t) => t.dataset.letter === slot
          )
          tile.click()
          await wait(150)
        }
      } else if (beat.kind === 'listen-repeat' || beat.kind === 'finale') {
        for (let i = 0; i < beat.words.length; i++) {
          await clickWhenEnabled('#mic-btn')
          await wait(150)
        }
      }
      // A scored beat with readAloud lands on the read-aloud confirmation
      // screen next, regardless of which branch above just ran.
      if (beat.scored && beat.readAloud) {
        await clickWhenEnabled('#mic-btn')
      }
      } catch (e) {
        e.message = `beat[${bi}] kind=${beat.kind} id=${beat.id}: ${e.message}`
        throw e
      }
      await wait(200)
    }
  }

  async function recapAudioOrder() {
    const stage = chapters[0].stages[0]
    await enterStage('chapter-1', 0)
    await playThroughStage(stage)
    const reached = await until('.reward-screen', 30)
    // whenAudioIdle() only reflects the queue as constructed *so far* --
    // speakSequence() enqueues its items one at a time across ticks, so
    // reading it right away can resolve after just ko + en[0]. Poll for the
    // last English item instead, then confirm idle.
    const lastEn = stage.recapAudio.en[stage.recapAudio.en.length - 1]
    await waitForSpeech((sp) => sp.lastIndexOf(lastEn) > sp.lastIndexOf(stage.recapAudio.ko))
    await audio.whenAudioIdle()
    const ko = stage.recapAudio.ko
    const en = stage.recapAudio.en
    // The stage's own beats say several of these same English words already
    // (each option's `say`), so the FIRST occurrence in the whole transcript
    // is not necessarily the reward screen's. Anchor the search at ko's
    // position instead: each word only has to appear after the previous
    // match, starting from there -- exactly the order the two calls in
    // renderReward() enqueue them in.
    const idxKo = spoken.lastIndexOf(ko)
    let cursor = idxKo
    const enIdx = en.map((w) => {
      const idx = spoken.indexOf(w, cursor + 1)
      if (idx !== -1) cursor = idx
      return idx
    })
    const enInOrder = enIdx.every((v) => v !== -1)
    check(
      'reward-recapaudio-ko-then-en-in-order',
      reached && idxKo !== -1 && enInOrder,
      `reached=${reached} ko@${idxKo} en@${JSON.stringify(enIdx)} tail=${JSON.stringify(spoken.slice(idxKo))}`
    )
  }

  // --- match-shape: tap never speaks a `say` sound, only opt.label --------
  async function matchShapeNoSoundLeak() {
    const stage = chapters[0].stages[0]
    const saved = stage.beats
    // Synthetic beat: deliberately gives the wrong option a `say` field, the
    // exact mistake the renderer must be immune to (a copy-pasted `say` from
    // a choose beat leaking a phonics sound into a shape round).
    stage.beats = [
      {
        kind: 'match-shape',
        instructionKo: 'b 모양을 찾아보세요',
        options: [

  // --- full curriculum sweep: every stage in every chapter, played to the
  // end via correct-only taps, checking for exceptions, a live health bar
  // hitting exactly 0%, checkpoint write/clear, and recapAudio ordering.
  // Never mutates chapter data (N1 lesson: this walks the app purely by
  // click, through the same module instances the app itself uses).
  async function allStagesPlaythrough() {
    const onlyChapter = params.get('ch')
    const results = []
    for (const chapter of chapters) {
      if (onlyChapter && chapter.id !== onlyChapter) continue
      for (let i = 0; i < chapter.stages.length; i++) {
        const stage = chapter.stages[i]
        errors = 0
        spoken = []
        state.clearCheckpoint()
        let sawZeroHealth = false
        const obs = new MutationObserver(() => {
          const el = document.getElementById('health-fill')
          if (el && el.style.width === '0%') sawZeroHealth = true
        })
        obs.observe(document.getElementById('app'), {
          attributes: true,
          subtree: true,
          attributeFilter: ['style'],
        })
        let sawCheckpointMidStage = false
        const checkpointPoll = setInterval(() => {
          const cp = state.progress.checkpoint
          if (cp && cp.stageId === stage.id && cp.beatIndex > 0) {
            sawCheckpointMidStage = true
          }
        }, 100)
        let threw = null
        try {
          await enterStage(chapter.id, i)
          await playThroughStage(stage)
          await until('.reward-screen', 60)
        } catch (e) {
          threw = e.message || String(e)
        }
        obs.disconnect()
        clearInterval(checkpointPoll)
        const reached = !!document.querySelector('.reward-screen')
        let recapOk = false
        let recapDetail = ''
        if (reached) {
          const en0 = stage.recapAudio ? stage.recapAudio.en : []
          const lastEn = en0[en0.length - 1]
          if (lastEn) {
            await waitForSpeech(
              (sp) => sp.lastIndexOf(lastEn) > sp.lastIndexOf(stage.recapAudio.ko)
            )
          }
          await audio.whenAudioIdle()
          const ko = stage.recapAudio && stage.recapAudio.ko
          const en = (stage.recapAudio && stage.recapAudio.en) || []
          const idxKo = ko ? spoken.lastIndexOf(ko) : -1
          let cursor = idxKo
          const enIdx = en.map((w) => {
            const idx = spoken.indexOf(w, cursor + 1)
            if (idx !== -1) cursor = idx
            return idx
          })
          recapOk = idxKo !== -1 && enIdx.every((v) => v !== -1)
          recapDetail = `ko@${idxKo} en@${JSON.stringify(enIdx)}`
        }
        const checkpointClearedAfter = state.progress.checkpoint === null
        const pass =
          !threw && reached && sawZeroHealth && sawCheckpointMidStage && recapOk && checkpointClearedAfter && errors === 0
        results.push({
          id: stage.id,
          pass,
          threw,
          reached,
          sawZeroHealth,
          sawCheckpointMidStage,
          recapOk,
          recapDetail,
          checkpointClearedAfter,
          errors,
        })
        // Leave no state behind for the next stage in the loop.
        state.clearCheckpoint()
      }
    }
    const failed = results.filter((r) => !r.pass)
    check(
      'all-stages-playthrough',
      failed.length === 0,
      failed.length === 0
        ? `${results.length}/${results.length} stages clean: ${results.map((r) => r.id).join(', ')}`
        : `${results.length - failed.length}/${results.length} clean; FAILED: ` +
          failed
            .map(
              (r) =>
                `${r.id}[threw=${r.threw} reached=${r.reached} zeroHealth=${r.sawZeroHealth} ` +
                `cpMid=${r.sawCheckpointMidStage} recap=${r.recapOk}(${r.recapDetail}) cpCleared=${r.checkpointClearedAfter} errs=${r.errors}]`
            )
            .join(' | ')
    )
    // Full per-stage ledger, independent of pass/fail, for the report.
    document.documentElement.setAttribute('data-stage-ledger', JSON.stringify(results))
  }

  // --- digraph (2-letter) rendering check -- ai/oa are the project's first
  // two-letter graphemes (chapter 7, phonics data not landed yet), and
  // every place a "letter" gets displayed was built and tested against
  // single characters only. Exercise each render path with a synthetic
  // 2-letter beat before real data exists, and measure for the thing that
  // actually matters for a 5-year-old: does it fit without scrolling, and
  // is it legible (not so small it reads as noise, not so cramped it
  // clips) -- not just "does it render without throwing".
  async function digraphRender() {
    const stage = chapters[0].stages[0]
    const saved = stage.beats
    const noScroll = () => {
      const de = document.documentElement
      const vw = window.innerWidth
      const vh = window.innerHeight
      const ovfX = Math.max(de.scrollWidth, document.body.scrollWidth) - vw
      const ovfY = Math.max(de.scrollHeight, document.body.scrollHeight) - vh
      return { ovfX, ovfY, ok: ovfX <= 0 && ovfY <= 0 }
    }
    const results = {}
    try {
      // 1) teach beat's beat.letter -> .big-letter
      stage.beats = [
        { kind: 'teach', instructionKo: 'ai 소리를 배워봐요', letter: 'ai', repeatAudio: ['ai'] },
      ]
      await enterStage('chapter-1', 0)
      await until('.big-letter')
      const bigLetterEl = document.querySelector('.big-letter')
      results.teachLetter = {
        text: bigLetterEl.textContent,
        rect: bigLetterEl.getBoundingClientRect().width,
        ...noScroll(),
      }

      // 2) choose beat's promptLetter -> .big-letter, plus letterTile options
      //    with 2-letter labels (the actual thing that would ship for a
      //    diphthong-matching round: "which word has the ai sound").
      stage.beats = [
        {
          kind: 'choose',
          instructionKo: 'ai 소리가 나는 글자를 찾아보세요',
          promptLetter: 'ai',
          scored: false,
          options: [
            { id: 'ai', icon: 'letterTile', label: 'ai', correct: true },
            { id: 'oa', icon: 'letterTile', label: 'oa', correct: false },
            { id: 'ee', icon: 'letterTile', label: 'ee', correct: false },
          ],
        },
      ]
      state.clearCheckpoint()
      await enterStage('chapter-1', 0)
      await until('.big-letter')
      const promptEl = document.querySelector('.big-letter')
      const tiles = [...document.querySelectorAll('.option-btn')]
      results.choosePromptLetter = {
        text: promptEl.textContent,
        rect: promptEl.getBoundingClientRect().width,
        ...noScroll(),
      }
      results.optionLabelVisible = tiles.map((btn) => {
        const label = btn.querySelector('.option-label')
        const cs = getComputedStyle(label)
        return {
          text: label.textContent,
          srOnly: label.classList.contains('sr-only'),
          // sr-only in this app's CSS clips to a 1x1px box off-screen --
          // check the box, not just the class name, in case that ever
          // changes underneath this check.
          visuallyHidden: parseFloat(cs.width) <= 1 && parseFloat(cs.height) <= 1,
        }
      })

      // 3) match-shape beat with 2-letter options (the shape-discrimination
      // path -- does it survive a digraph the way it does b/d).
      stage.beats = [
        {
          kind: 'match-shape',
          instructionKo: 'ai 모양을 찾아보세요',
          promptLetter: 'ai',
          options: [
            { id: 'ai', icon: 'letterTile', label: 'ai', correct: true },
            { id: 'oa', icon: 'letterTile', label: 'oa', correct: false },
          ],
        },
      ]
      state.clearCheckpoint()
      await enterStage('chapter-1', 0)
      await until('.options-grid')
      // A fixed sleep cannot measure this. It used to be wait(300), which
      // raced audio.js's gap-before-a-tap: that gap is only short once the
      // engine has proven its onend trustworthy, and at the start of a run it
      // has proven nothing, so the utterance began after the 300ms window and
      // the case reported `[]` -- a real-looking failure with no app bug
      // behind it. Drain first, then wait on the transcript (the helper this
      // file already has), then drain again so a *second*, leaked utterance
      // still lands inside the snapshot -- the join()==='ai' assertion below
      // is what catches a leak, and it can only catch what it can see.
      await audio.whenAudioIdle()
      spoken = []
      document.querySelector('[data-id="ai"]').click()
      await waitForSpeech((sp) => sp.length > 0, 6000)
      await audio.whenAudioIdle()
      results.matchShapeTapSpoke = [...spoken]
      results.matchShapeNoScroll = noScroll()
    } finally {
      stage.beats = saved
      state.clearCheckpoint()
    }

    const allNoScroll =
      results.teachLetter.ok && results.choosePromptLetter.ok && results.matchShapeNoScroll.ok
    check(
      'digraph-fits-without-scroll',
      allNoScroll,
      JSON.stringify({
        teach: { text: results.teachLetter.text, w: Math.round(results.teachLetter.rect), ovfX: results.teachLetter.ovfX },
        choose: { text: results.choosePromptLetter.text, w: Math.round(results.choosePromptLetter.rect), ovfX: results.choosePromptLetter.ovfX },
        matchShape: results.matchShapeNoScroll,
      })
    )
    // A digraph letterTile ("ai") is one taught letterform, same as a
    // single letter -- the icon already embosses it, so the plain-text
    // label underneath must be screen-reader-only, not a visible duplicate
    // (that duplicate is exactly the "two renderings of one letterform"
    // problem the sr-only rule exists to prevent -- see optionLabelHtml()).
    const allSrOnlyCorrect = results.optionLabelVisible.every(
      (o) => o.srOnly === true && o.visuallyHidden === true
    )
    check(
      'digraph-option-label-sr-only-consistent',
      allSrOnlyCorrect,
      JSON.stringify(results.optionLabelVisible)
    )
    check(
      'digraph-matchshape-speaks-label-not-say',
      results.matchShapeTapSpoke.join() === 'ai',
      JSON.stringify(results.matchShapeTapSpoke)
    )
    document.documentElement.setAttribute('data-digraph-detail', JSON.stringify(results))
  }

  // renderBuildBeat's tiles are plain text buttons (not the letterTile SVG
  // icon), fixed-size via CSS -- worth checking a digraph tile there too,
  // since a future "rain" = r + ai + n blend round is a plausible next
  // step for chapter 7 content.
  // --- chapter-7 boss stage: the first stage whose drag-build targets are
  // slot ARRAYS (['R','AI','N']) rather than plain words. Plays it to the
  // end and measures whether a 2-character slot/tile actually fits its
  // fixed-size box, since those boxes were sized for one character.
  async function digraphBuildStage() {
    const stage = chapters[6].stages[4] // c7-stage-5
    const buildIdx = stage.beats.findIndex((b) => b.kind === 'drag-build')
    errors = 0
    state.clearCheckpoint()
    const measurements = []
    let threw = null
    // scrollWidth > clientWidth means the glyphs are wider than the box --
    // these boxes have no overflow:hidden, so the text spills past the
    // border rather than being clipped.
    // scrollWidth alone under-reports here: these boxes centre their text
    // with flexbox, and centred content that is too wide spills equally out
    // of BOTH sides without ever growing scrollWidth. Measure the glyphs
    // themselves with a Range over the text node and compare against the
    // element's own box.
    const measure = (el, kind) => {
      const box = el.getBoundingClientRect()
      let textW = 0
      if (el.firstChild) {
        const r = document.createRange()
        r.selectNodeContents(el)
        textW = r.getBoundingClientRect().width
      }
      return {
        kind,
        text: el.textContent,
        textW: Math.round(textW),
        boxW: Math.round(box.width),
        scrollW: el.scrollWidth,
        clientW: el.clientWidth,
        // Compare against the content box: the border is 5px a side and the
        // glyphs sitting on top of it is already visually wrong.
        overflows: textW > el.clientWidth + 0.5,
      }
    }
    try {
      await enterStage('chapter-7', 4)
      await walkBeats(stage, 0, buildIdx) // advance to the first build beat
      await until('.build-slots')
      for (const t of [...document.querySelectorAll('.letter-tile')]) {
        measurements.push(measure(t, 'letter-tile'))
      }
      const beat = stage.beats[buildIdx]
      for (const slot of slotsOf(beat.target)) {
        const tile = [...document.querySelectorAll('.letter-tile:not(:disabled)')].find(
          (t) => t.dataset.letter === slot
        )
        tile.click()
        await wait(220)
      }
      for (const sl of [...document.querySelectorAll('.build-slot')]) {
        measurements.push(measure(sl, 'build-slot'))
      }
    } catch (e) {
      threw = e.message || String(e)
    }
    const overflow = measurements.filter((m) => m.overflows)
    const twoChar = measurements.filter((m) => m.text.length === 2)
    check(
      'ch7-digraph-build-boxes-fit',
      !threw && errors === 0 && overflow.length === 0,
      `threw=${threw} errors=${errors} twoCharBoxes=${JSON.stringify(twoChar)} overflowing=${JSON.stringify(overflow)}`
    )
    document.documentElement.setAttribute('data-digraph-css', JSON.stringify(measurements))
    state.clearCheckpoint()
  }

  // --- every drag-build beat in the curriculum, both target forms, each
  // solved from a fresh render: proves the legacy string form still works
  // and the new slot-array form works, in one comparable table.
  async function allBuildBeats() {
    const rows = []
    for (const chapter of chapters) {
      for (let si = 0; si < chapter.stages.length; si++) {
        const stage = chapter.stages[si]
        const buildIdxs = stage.beats
          .map((b, i) => (b.kind === 'drag-build' ? i : -1))
          .filter((i) => i >= 0)
        if (!buildIdxs.length) continue
        for (const bi of buildIdxs) {
          const beat = stage.beats[bi]
          errors = 0
          state.clearCheckpoint()
          let threw = null
          let slotCount = null
          let completed = false
          try {
            await enterStage(chapter.id, si)
            await walkBeats(stage, 0, bi)
            await until('.build-slots')
            slotCount = document.querySelectorAll('.build-slot').length
            const slots = slotsOf(beat.target)
            for (const slot of slots) {
              const tile = [...document.querySelectorAll('.letter-tile:not(:disabled)')].find(
                (t) => t.dataset.letter === slot
              )
              tile.click()
              await wait(200)
            }
            // Completed rounds either jump to read-aloud or advance a beat;
            // either way the build slots are gone.
            completed =
              !!document.querySelector('.readaloud-beat') ||
              !document.querySelector('.build-slots') ||
              [...document.querySelectorAll('.build-slot')].every((s) => s.textContent)
          } catch (e) {
            threw = e.message || String(e)
          }
          rows.push({
            stage: stage.id,
            beat: beat.id,
            form: Array.isArray(beat.target) ? 'array' : 'string',
            target: JSON.stringify(beat.target),
            expectedSlots: slotsOf(beat.target).length,
            slotCount,
            completed,
            threw,
            errors,
            ok: !threw && errors === 0 && completed && slotCount === slotsOf(beat.target).length,
          })
          state.clearCheckpoint()
        }
      }
    }
    const bad = rows.filter((r) => !r.ok)
    const strings = rows.filter((r) => r.form === 'string')
    const arrays = rows.filter((r) => r.form === 'array')
    check(
      'all-drag-build-beats-solvable',
      bad.length === 0,
      bad.length === 0
        ? `${rows.length} build beats OK (${strings.length} legacy string-target, ${arrays.length} slot-array): ` +
          rows.map((r) => `${r.beat}=${r.target}/${r.slotCount}slots`).join(' ')
        : `FAILED ${bad.length}/${rows.length}: ` +
          bad.map((r) => `${r.beat}[${r.form} ${r.target} slots=${r.slotCount}/${r.expectedSlots} completed=${r.completed} threw=${r.threw}]`).join(' | ')
    )
    document.documentElement.setAttribute('data-build-ledger', JSON.stringify(rows))
  }

  // --- early-onend hypothesis -------------------------------------------
  // iPadOS Safari is known to fire an utterance's `onend` before (or
  // immediately after) playback actually finishes. The queue trusts onend to
  // decide when the next utterance may start, so if onend lies, we start
  // speaking over audio that is still playing -- which a listener hears as
  // "repeated too fast / slurred together", exactly the reported symptom.
  // Simulate it: fire onend after `onendDelay` while tracking each
  // utterance's REAL duration (measured on this machine with say/afinfo at
  // the app's own rate), then check whether the next speak() call lands
  // before the previous utterance's real audio would have finished.
  // These are REAL durations, not the floor audio.js computes -- the whole
  // test is "would the next utterance land on this one's tail", so a value
  // that is too SMALL makes the harness pass a collision it should have
  // caught. That is exactly what happened: the table was measured at the old
  // EN_RATE of 0.85 and left behind when the rate dropped to 0.5, so every
  // English row was ~9% short (a few much worse -- "sun" was 449 against a
  // real 613). The Korean row was right, because speakKO's rate never moved.
  //
  // Re-measure like this, and keep the two traps in mind:
  //   say -v Samantha -r 88 -o t.aiff "lll, lll, lll"   # rate 0.5
  //   afinfo t.aiff | grep "estimated duration"
  // (1) -r 88 is Web Speech rate 0.5: the voices' own default is 175 wpm, and
  //     an unflagged `say` matches -r 175 to the millisecond -- verified again
  //     here, "elephant" 587ms both ways. Samantha and Yuna are the voices
  //     that matter; they are the iOS en-US/ko-KR defaults, and audio.js's
  //     floor is fitted to Samantha.
  // (2) Measure the string LOWERCASED. speakNow() lowercases before speaking
  //     and hands the utterance the lowered text, so `u.text` -- the key this
  //     table is looked up by -- is already lowercase. Measuring the data as
  //     written turns `say "S"` into "Capital S" (1013ms vs 447ms) and invents
  //     collisions that cannot happen. It also means an upper-case KEY here is
  //     dead code that silently falls through to the estimate: `Leo: 490` was,
  //     and is now `leo`.
  const REAL_MS = {
    // Samantha, -r 88 (= EN_RATE 0.5), measured 2026-08-22
    lll: 863, sss: 922, sssss: 689, a: 399, oh: 419, leo: 535, lap: 465,
    rain: 469, sun: 613, sock: 578, star: 567, elephant: 712,
    // the tutorials' comma-repeat form -- one utterance, internal pauses
    'lll, lll, lll': 2988, 'guh, guh, guh': 1874, 'a, a, a': 1641,
    'oh, oh, oh': 1673, 'iii, iii': 1266,
    // Korean recap lines, Yuna at speakKO's rate 1.0
    '에스 소리를 찾았어요! 잘 들어보세요.': 2796,
  }
  // Strings that had to be estimated rather than looked up. Reported, and
  // checked, because a silent fallback is how the table rotted in the first
  // place: nothing announced that the rate had changed underneath it.
  const realMsMisses = new Set()
  // Deliberately an OVER-estimate -- it over-shoots every string in the
  // corpus above (worst: "a", +251ms). An under-estimate here would hide
  // collisions, which is the one failure mode this whole test exists for.
  // Length is a poor predictor at this rate (3-character "sun" is 613ms and
  // 4-character "sock" is 578ms), so this is an envelope, not a fit. Commas
  // and Hangul get their own terms for the same reason audio.js gives them
  // their own: a comma is an internal pause, and a Hangul block is a syllable.
  const realMsOf = (t) => {
    const s = String(t)
    if (REAL_MS[s] != null) return REAL_MS[s]
    realMsMisses.add(s)
    if (/[가-힣]/.test(s)) return 170 * s.length
    if (s.includes(',')) return Math.max(230 * s.length, 700 * s.split(',').length)
    return Math.max(650, 95 * s.length)
  }

  async function measureTimeline(onendDelayFn, run) {
    const origSpeak = window.speechSynthesis.speak
    const events = []
    const t0 = performance.now()
    window.speechSynthesis.speak = (u) => {
      const at = performance.now() - t0
      const real = realMsOf(u.text)
      events.push({ text: u.text, at, real })
      const d = onendDelayFn(real)
      setTimeout(() => u.onend && u.onend(), d)
    }
    try {
      await run()
    } finally {
      window.speechSynthesis.speak = origSpeak
    }
    // Positive overlap = next utterance started while this one was still
    // audibly playing.
    let worst = 0
    const pairs = []
    for (let i = 0; i + 1 < events.length; i++) {
      const ov = Math.round(events[i].at + events[i].real - events[i + 1].at)
      pairs.push(`${events[i].text}->${events[i + 1].text}:${ov > 0 ? '+' + ov : ov}`)
      if (ov > worst) worst = ov
    }
    return { events, worst, pairs, total: Math.round(performance.now() - t0) }
  }

  async function onendEarlyHypothesis() {
    audio.clearAudioQueue()
    // 1) teach sequence, the reported case: three identical short sounds
    // the real current tutorial shape: comma-repeat utterances, not 3 blips
    const teachSeq = ['lll, lll, lll', 'lap', 'lll, lll, lll']
    const teachHonest = await measureTimeline(
      (real) => real,
      () => audio.speakSequence(teachSeq, 'en-US')
    )
    audio.clearAudioQueue()
    const teachEarly = await measureTimeline(
      () => 0,
      () => audio.speakSequence(teachSeq, 'en-US')
    )
    // 2) reward screen, the MIN_GAP_MS path: a long Korean line immediately
    //    followed by an English sequence (renderReward does exactly this).
    audio.clearAudioQueue()
    const ko = '에스 소리를 찾았어요! 잘 들어보세요.'
    const rewardHonest = await measureTimeline(
      (real) => real,
      async () => {
        audio.speakKO(ko)
        await audio.speakSequence(['sss', 'sun'], 'en-US')
      }
    )
    audio.clearAudioQueue()
    const rewardEarly = await measureTimeline(
      () => 0,
      async () => {
        audio.speakKO(ko)
        await audio.speakSequence(['sss', 'sun'], 'en-US')
      }
    )
    audio.clearAudioQueue()
    const detail = {
      teachHonest: { worst: teachHonest.worst, total: teachHonest.total, pairs: teachHonest.pairs },
      teachEarly: { worst: teachEarly.worst, total: teachEarly.total, pairs: teachEarly.pairs },
      rewardHonest: { worst: rewardHonest.worst, total: rewardHonest.total, pairs: rewardHonest.pairs },
      rewardEarly: { worst: rewardEarly.worst, total: rewardEarly.total, pairs: rewardEarly.pairs },
    }
    document.documentElement.setAttribute('data-onend-detail', JSON.stringify(detail))
    // A strict lower bound cannot reach exactly zero: the bound must stay
    // under the *shortest* real string of each class, so the longest string in
    // that class keeps some slack. Measured worst residuals are 85ms (the
    // comma-repeat tutorial form) and 114ms (a long word on the 500ms
    // single-utterance path) -- a consonant tail, not an audible collision.
    // Closing it further would mean overshooting real durations, which would
    // add dead air on every browser whose onend is honest.
    const TOLERATED_TAIL_MS = 120
    check(
      'onend-early-overlap-within-tail-tolerance',
      teachEarly.worst <= TOLERATED_TAIL_MS && rewardEarly.worst <= TOLERATED_TAIL_MS,
      `tolerance=${TOLERATED_TAIL_MS}ms ` + JSON.stringify(detail)
    )
    // Everything the two scenarios speak must be a MEASURED duration. If a
    // scenario grows a new string, or content changes what the reward screen
    // says, the estimate above quietly takes over and the verdict stops
    // meaning anything -- which is the failure this case had for a whole rate
    // change. Fix by measuring the listed string into REAL_MS, not by
    // widening the tolerance.
    check(
      'onend-early-durations-all-measured',
      realMsMisses.size === 0,
      realMsMisses.size === 0
        ? 'no estimated durations'
        : `estimated (add to REAL_MS): ${JSON.stringify([...realMsMisses])}`
    )
  }

  // Which existing class can hold a boss equation without overflowing? No new
  // CSS is allowed here, so measure the candidates against the real cascade
  // inside a real stage screen, in both orientations.
  async function equationFit() {
    state.clearCheckpoint()
    await enterStage('chapter-1', 4)
    await until('.beat')
    const host = document.querySelector('.beat')
    const longest = 'R + AI + N = RAIN'
    const candidates = ['big-letter', 'target-word', 'beat-instruction', 'beat-equation']
    const out = {}
    for (const cls of candidates) {
      const d = document.createElement('div')
      d.className = cls
      d.textContent = longest
      d.style.whiteSpace = 'nowrap'
      host.appendChild(d)
      const r = d.getBoundingClientRect()
      out[cls] = {
        fontPx: Math.round(parseFloat(getComputedStyle(d).fontSize)),
        textW: Math.round(r.width),
        viewportW: window.innerWidth,
        fitsOnOneLine: r.width <= window.innerWidth,
      }
      d.remove()
    }
    check('equation-class-fit', true, `vw=${window.innerWidth} ${JSON.stringify(out)}`)
    document.documentElement.setAttribute('data-eqfit', JSON.stringify(out))
    state.clearCheckpoint()
  }

  // Every chapter's boss teach beat: correct equations, and no overflow in
  // whichever orientation the window is set to.
  async function bossEquations() {
    const rows = []
    for (let ci = 0; ci < chapters.length; ci++) {
      const chapter = chapters[ci]
      const si = chapter.stages.findIndex((s) => s.chapterBoss)
      const stage = chapter.stages[si]
      errors = 0
      state.clearCheckpoint()
      let threw = null
      let info = {}
      try {
        await enterStage(chapter.id, si)
        // The intro overlays the teach content; tap to skip straight to it.
        const intro = document.getElementById('boss-intro')
        if (intro) intro.click()
        await until('.beat-equation', 60)
        const eqs = [...document.querySelectorAll('.beat-equation')]
        const de = document.documentElement
        info = {
          lines: eqs.map((e) => e.textContent),
          widest: Math.max(...eqs.map((e) => Math.round(e.getBoundingClientRect().width))),
          // an equation must never wrap: scrollWidth > clientWidth means the
          // single line did not fit its own box
          anyWrapped: eqs.some((e) => e.scrollWidth > e.clientWidth + 1),
          emojiStillShown: !!document.querySelector('.beat-emoji'),
          vw: window.innerWidth,
          vh: window.innerHeight,
          ovfX: Math.max(de.scrollWidth, document.body.scrollWidth) - window.innerWidth,
          ovfY: Math.max(de.scrollHeight, document.body.scrollHeight) - window.innerHeight,
        }
      } catch (e) {
        threw = e.message || String(e)
      }
      rows.push({ chapter: chapter.id, stage: stage.id, threw, ...info })
      state.clearCheckpoint()
    }
    const bad = rows.filter(
      (r) => r.threw || !r.lines || !r.lines.length || r.anyWrapped || r.ovfX > 0 || r.ovfY > 0 || r.emojiStillShown
    )
    check(
      'boss-equations-fit',
      bad.length === 0,
      `${window.innerWidth}x${window.innerHeight} :: ` +
        rows
          .map(
            (r) =>
              `${r.chapter}[${(r.lines || []).join(' / ')}|w=${r.widest}|ovfX=${r.ovfX}|ovfY=${r.ovfY}${r.anyWrapped ? '|WRAPPED' : ''}${r.emojiStillShown ? '|EMOJI-LEFT' : ''}${r.threw ? '|threw=' + r.threw : ''}]`
          )
          .join(' ')
    )
  }

  // --- wrong-ORDER drag-build --------------------------------------------
  // The renderer used to refuse any tile that wasn't the next needed slot, so
  // the word could never come out wrong and the Undo button had nothing to
  // undo. Now placement is unconditional and the word is judged when the last
  // slot fills. That opens a failure mode nothing else here would catch: a
  // wrong word that quietly *counts* as a completion (beat advances, or worse,
  // dealHit runs) -- or a round that can no longer be finished at all, which
  // shows up as a health bar that never reaches 0. These cases pin both ends.

  // Health has no exported accessor; the bar's own width is the observable.
  const healthPct = () => {
    const el = document.getElementById('health-fill')
    return el ? parseInt(el.style.width, 10) : null
  }

  const buildSlotTexts = () =>
    [...document.querySelectorAll('.build-slot')].map((s) => s.textContent)

  // A correct completion goes through whenAudioIdle(), and by then the round
  // has a queue of tap sounds behind it (every placement speaks, including the
  // wrong-order ones) -- each held for audio.js's measured minimum. A fixed
  // sleep here reads as "the round never completed"; poll instead.
  async function buildCompleted(tries = 80) {
    for (let i = 0; i < tries; i++) {
      if (document.querySelector('.readaloud-beat')) return true
      if (!document.querySelector('.build-slots')) return true
      await wait(100)
    }
    return false
  }

  async function tapSlots(seq, gap = 180) {
    for (const letter of seq) {
      const tile = [...document.querySelectorAll('.letter-tile:not(:disabled)')].find(
        (t) => t.dataset.letter === letter
      )
      if (!tile) throw new Error(`no enabled tile for "${letter}"`)
      tile.click()
      await wait(gap)
    }
  }

  // A permutation of the same slots that is NOT the target order. Returns null
  // when the target can't be misordered (one slot, or every slot identical) --
  // those beats are reported rather than silently "passing" a check that never
  // ran.
  const misorder = (slots) => {
    const cands = []
    if (slots.length >= 2) {
      cands.push([slots[1], slots[0], ...slots.slice(2)])
      cands.push([...slots].reverse())
      cands.push([slots[slots.length - 1], ...slots.slice(0, -1)])
    }
    return cands.find((c) => c.some((s, i) => s !== slots[i])) || null
  }

  // Walks to a stage's first drag-build beat and hands it back, rendered.
  async function toFirstBuild(chapterId, stageIndex, stage) {
    const bi = stage.beats.findIndex((b) => b.kind === 'drag-build')
    state.clearCheckpoint()
    await enterStage(chapterId, stageIndex)
    await walkBeats(stage, 0, bi)
    await until('.build-slots')
    return stage.beats[bi]
  }

  // Chapter 1 boss, target 'SAT': wrong order lands, is visible, costs
  // nothing, and Undo pops exactly ONE slot (not the whole word).
  async function buildWrongOrder() {
    const stage = chapters[0].stages[4]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBuild('chapter-1', 4, stage)
      const slots = slotsOf(beat.target)
      const wrong = misorder(slots)
      obs.target = slots.join('')
      obs.wrong = wrong ? wrong.join('') : null
      obs.hpBefore = healthPct()
      await tapSlots(wrong)
      await wait(400)
      // 1. the wrong word is actually STANDING in the slots (no guard-rail)
      obs.slotsAfterWrong = buildSlotTexts()
      obs.allSlotsFilled = obs.slotsAfterWrong.every((t) => t.length > 0)
      obs.builtWrongWord = obs.slotsAfterWrong.join('') === obs.wrong
      // 2. it did NOT count: round still on screen, no read-aloud, no damage
      obs.stillOnRound = !!document.querySelector('.build-slots')
      obs.leakedToReadAloud = !!document.querySelector('.readaloud-beat')
      obs.hpAfterWrong = healthPct()
      // 3. Undo is one step
      const undo = document.getElementById('clear-btn')
      obs.undoPresent = !!undo
      undo.click()
      await wait(150)
      obs.slotsAfterOneUndo = buildSlotTexts()
      obs.filledAfterOneUndo = obs.slotsAfterOneUndo.filter((t) => t.length > 0).length
      obs.tileReenabled =
        document.querySelectorAll('.letter-tile:not(:disabled)').length > 0
      // 4. repeated Undo empties it, and never underflows
      for (let i = 0; i < slots.length + 3; i++) {
        document.getElementById('clear-btn').click()
        await wait(60)
      }
      obs.slotsAfterManyUndo = buildSlotTexts()
      obs.emptyAfterManyUndo = obs.slotsAfterManyUndo.every((t) => t === '')
      // 5. and the round is still winnable afterwards
      await tapSlots(slots)
      obs.completed = await buildCompleted()
      if (document.querySelector('.readaloud-beat')) {
        await clickWhenEnabled('#mic-btn')
        await wait(400)
        obs.hpAfterCorrect = healthPct()
      }
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'build-wrong-order-is-placeable-and-costs-nothing',
      !threw &&
        errors === 0 &&
        obs.wrong !== null &&
        obs.allSlotsFilled === true &&
        obs.builtWrongWord === true &&
        obs.stillOnRound === true &&
        obs.leakedToReadAloud === false &&
        obs.hpAfterWrong === obs.hpBefore &&
        obs.filledAfterOneUndo === slotsOf(stage.beats.find((b) => b.kind === 'drag-build').target).length - 1 &&
        obs.emptyAfterManyUndo === true &&
        obs.completed === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // Two wrong words in a row must trigger the same rescue every other beat
  // has: the board clears itself and the first sound is re-demonstrated.
  // Also the negative: ONE wrong word must NOT clear it (that would be the
  // app doing the child's Undo for them).
  async function buildWrongRescue() {
    const stage = chapters[0].stages[4]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBuild('chapter-1', 4, stage)
      const slots = slotsOf(beat.target)
      const wrong = misorder(slots)
      await tapSlots(wrong)
      await wait(400)
      obs.keptAfterFirstWrong = buildSlotTexts().filter((t) => t).length
      // clear it by hand (that is the point of Undo) and get it wrong again
      for (let i = 0; i < slots.length; i++) {
        document.getElementById('clear-btn').click()
        await wait(60)
      }
      spoken = []
      await tapSlots(wrong)
      await wait(500)
      obs.slotsAfterSecondWrong = buildSlotTexts()
      obs.autoCleared = obs.slotsAfterSecondWrong.every((t) => t === '')
      obs.allTilesBack =
        document.querySelectorAll('.letter-tile:not(:disabled)').length ===
        document.querySelectorAll('.letter-tile').length
      // re-demonstration fires on a 1.2s timer: the first slot's own sound
      const firstSay = (() => {
        const l = beat.letters
          .map((x) => (typeof x === 'string' ? { text: x, say: x } : { text: x.text, say: x.say || x.text }))
          .find((x) => x.text === slots[0])
        return l ? l.say : slots[0]
      })()
      obs.redemonstrated = await waitForSpeech((sp) => sp.includes(firstSay), 4000)
      obs.pulsed = !!document.querySelector('.letter-tile.hint-pulse')
      // still winnable after the rescue
      await tapSlots(slots)
      obs.completed = await buildCompleted()
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'build-two-wrong-words-rescue',
      !threw &&
        errors === 0 &&
        obs.keptAfterFirstWrong > 0 &&
        obs.autoCleared === true &&
        obs.allTilesBack === true &&
        obs.redemonstrated === true &&
        obs.completed === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // The digraph invariant, on the wrong-order path this time: 'AI' must land
  // in ONE slot even when it lands in the WRONG slot. If anything ever split
  // it into 'A' + 'I' the slot texts would be single characters and the
  // target could never be matched again.
  async function buildWrongOrderDigraph() {
    const stage = chapters[6].stages[4]
    errors = 0
    let threw = null
    const obs = {}
    try {
      const beat = await toFirstBuild('chapter-7', 4, stage)
      const slots = slotsOf(beat.target)
      const wrong = misorder(slots)
      obs.target = JSON.stringify(slots)
      obs.wrong = JSON.stringify(wrong)
      await tapSlots(wrong)
      await wait(400)
      const texts = buildSlotTexts()
      obs.slots = texts
      obs.twoCharSlots = texts.filter((t) => t.length === 2)
      obs.digraphIntact =
        slots.filter((s) => s.length === 2).length === obs.twoCharSlots.length
      obs.matchesWrongOrder = texts.join('|') === wrong.join('|')
      obs.stillOnRound = !!document.querySelector('.build-slots')
      // fix it the way the child would, then finish
      for (let i = 0; i < slots.length; i++) {
        document.getElementById('clear-btn').click()
        await wait(60)
      }
      await tapSlots(slots)
      obs.completed = await buildCompleted()
    } catch (e) {
      threw = e.message || String(e)
    }
    check(
      'build-wrong-order-keeps-digraph-in-one-slot',
      !threw &&
        errors === 0 &&
        obs.digraphIntact === true &&
        obs.matchesWrongOrder === true &&
        obs.stillOnRound === true &&
        obs.completed === true,
      `threw=${threw} errors=${errors} ${JSON.stringify(obs)}`
    )
    state.clearCheckpoint()
  }

  // The silent-failure check this change is actually risky for: play whole
  // boss stages where EVERY build beat is first built in the wrong order,
  // then undone, then built right -- and assert the health bar still reaches
  // 0 and the reward screen still lands. A wrong order that ate a hit, or a
  // round that couldn't recover, both surface here as hp > 0.
  async function buildWrongOrderStages() {
    const rows = []
    for (const ci of [0, 2, 6]) {
      const chapter = chapters[ci]
      const stage = chapter.stages[chapter.stages.length - 1]
      const si = chapter.stages.length - 1
      errors = 0
      state.clearCheckpoint()
      let threw = null
      let minHp = null
      let wrongAttempts = 0
      let unmisorderable = 0
      const sampler = setInterval(() => {
        const p = healthPct()
        if (p !== null && (minHp === null || p < minHp)) minHp = p
      }, 40)
      try {
        await enterStage(chapter.id, si)
        for (let bi = 0; bi < stage.beats.length; bi++) {
          const beat = stage.beats[bi]
          if (beat.kind !== 'drag-build') {
            await walkBeats(stage, bi, bi + 1)
            continue
          }
          await until('.build-slots')
          const slots = slotsOf(beat.target)
          const wrong = misorder(slots)
          if (wrong) {
            wrongAttempts += 1
            await tapSlots(wrong, 120)
            await wait(300)
            if (!document.querySelector('.build-slots')) {
              throw new Error(`beat[${bi}] ${beat.id}: wrong order ENDED the round`)
            }
            // one extra tap with every slot full -- must not throw or advance
            const spare = document.querySelector('.letter-tile:not(:disabled)')
            if (spare) {
              spare.click()
              await wait(120)
            }
            for (let i = 0; i < slots.length; i++) {
              document.getElementById('clear-btn').click()
              await wait(60)
            }
          } else {
            unmisorderable += 1
          }
          await tapSlots(slots, 120)
          await wait(250)
          if (beat.scored && beat.readAloud) await clickWhenEnabled('#mic-btn')
          await wait(200)
        }
        await until('.reward-screen', 80)
      } catch (e) {
        threw = e.message || String(e)
      }
      clearInterval(sampler)
      const reached = !!document.querySelector('.reward-screen')
      rows.push({
        stage: stage.id,
        wrongAttempts,
        unmisorderable,
        minHealthPct: minHp,
        reachedReward: reached,
        errors,
        threw,
        ok: !threw && errors === 0 && reached && minHp === 0 && wrongAttempts > 0,
      })
      state.clearCheckpoint()
    }
    const bad = rows.filter((r) => !r.ok)
    check(
      'build-wrong-order-health-still-reaches-zero',
      bad.length === 0,
      JSON.stringify(rows)
    )
  }

  // --- top-level title width ---------------------------------------------
  // The world-select header is the app's title line and .map-header has no
  // nowrap: a longer title silently becomes two lines (this project already
  // had "Chapters 22-28" wrap at an ASCII hyphen). Measure the rendered
  // glyph run against the element's content box, with the old title as the
  // control -- a Range over the text node, because a wrapped line never
  // grows scrollWidth.
  async function worldHeaderFit() {
    screens.renderWorldSelect()
    await until('.map-header')
    const header = document.querySelector('.map-header')
    // The title string carries its own width bound in an inline font-size on
    // an inner span (see renderWorldSelect). Measure THAT element: replacing
    // .map-header's textContent would delete the span and silently measure at
    // the unshrunk header size -- reporting a wrap that the app doesn't have.
    const el = header.querySelector('span') || header
    const cs = getComputedStyle(el)
    const lineH = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.14
    const measureText = (text) => {
      const prev = el.textContent
      el.textContent = text
      const r = document.createRange()
      r.selectNodeContents(el)
      const rects = [...r.getClientRects()]
      const h = el.getBoundingClientRect().height
      const out = {
        text,
        lines: Math.max(rects.length, Math.round(h / lineH)),
        widest: Math.round(Math.max(...rects.map((x) => x.width))),
        // The available width is the HEADER's content box: the measured
        // element may be an inline span, whose clientWidth is always 0.
        boxW: Math.round(header.clientWidth),
      }
      el.textContent = prev
      return out
    }
    const now = measureText(el.textContent)
    const old = measureText('Carbot Phonics · Pick a World')
    // Unwrapped run width per candidate: how much has to give, and which
    // shorter phrasings would fit, without guessing at glyph widths.
    const prevWS = el.style.whiteSpace
    el.style.whiteSpace = 'nowrap'
    const nowrap = [
      el.textContent,
      'Carbot Phonics · Pick a World',
      "Yum JiHoon's Phonics",
      "JiHoon's Phonics · Pick a World",
    ].map(measureText)
    el.style.whiteSpace = prevWS
    check(
      'world-header-title-fits-one-line',
      now.lines === 1 && now.widest <= now.boxW + 0.5,
      JSON.stringify({
        vw: window.innerWidth, vh: window.innerHeight,
        headerFontSize: getComputedStyle(header).fontSize,
        titleFontSize: cs.fontSize,
        current: now, controlOldTitle: old,
        unwrappedRuns: nowrap.map((m) => `${m.text}=${m.widest}/${m.boxW}`),
      })
    )
  }

  // --- shadowed (unrevealed) character art + clear mark -------------------
  // Characters outside of play are silhouetted until their stage is cleared.
  // The silent failure to fear is the REVEAL: if the shadow never comes off,
  // the child clears a stage and still can't see the character. So both
  // states are asserted, on all three out-of-play screens, plus the negative
  // (the battle screen must never shadow anything) and the vertical cost of
  // the clear mark -- these screens run at 1-2% slack.
  const wipeProgress = () => {
    state.progress.clearedStages.length = 0
    for (const k of Object.keys(state.progress.stars)) delete state.progress.stars[k]
    state.clearCheckpoint()
    state.save()
  }

  const shadowScan = (sel) => {
    const arts = [...document.querySelectorAll(`${sel} svg`)]
    return {
      arts: arts.length,
      shadowed: arts.filter((a) => a.classList.contains('art-shadow')).length,
      // The class alone would pass even if the filter were dropped.
      filtered: arts.filter((a) => /brightness\(0\)/.test(a.style.filter)).length,
      marks: document.querySelectorAll(`${sel} .clear-mark`).length,
    }
  }

  async function shadowReveal() {
    const out = document.getElementById('out')
    const prevDisp = out.style.display
    out.style.display = 'none'
    const de = document.documentElement

      y: Math.max(de.scrollHeight, document.body.scrollHeight) - window.innerHeight,
      x: Math.max(de.scrollWidth, document.body.scrollWidth) - window.innerWidth,
    })
    const obs = { vp: `${window.innerWidth}x${window.innerHeight}` }
    let threw = null
    try {
      wipeProgress()
      screens.renderWorldSelect()
      await until('.chapter-card')
      obs.worldFresh = shadowScan('.chapter-card-art')
      obs.worldOvfFresh = ovf()
      screens.renderChapterSelect('world-1')
      await until('.chapter-card[data-chapter]')
      obs.chaptersFresh = shadowScan('.chapter-card-art')
      obs.chaptersOvfFresh = ovf()
      screens.renderMap('chapter-1')
      await until('.stage-node')
      obs.mapFresh = shadowScan('.stage-node')
      obs.mapOvfFresh = ovf()

      // clear chapter 1's boss (art node) and its stage 1 (number node)
      state.markStageCleared('stage-1', 3)
      state.markStageCleared('stage-5', 3)
      screens.renderMap('chapter-1')
      await until('.stage-node')
      obs.mapCleared = shadowScan('.stage-node')
      obs.mapOvfCleared = ovf()
      screens.renderChapterSelect('world-1')
      await until('.chapter-card[data-chapter]')
      obs.chaptersCleared = shadowScan('.chapter-card-art')
      obs.chaptersOvfCleared = ovf()
      screens.renderWorldSelect()
      await until('.chapter-card')
      obs.worldCleared = shadowScan('.chapter-card-art')
      obs.worldOvfCleared = ovf()

      // in play: never shadowed, cleared stage or not
      await enterStage('chapter-1', 0)
      await until('.villain-sprite svg')
      obs.battle = shadowScan('.battle-scene')
    } catch (e) {
      threw = e.message || String(e)
    }
    out.style.display = prevDisp
    wipeProgress()
    const ok =
      !threw &&
      // fresh: every portrait shadowed, no marks anywhere
      obs.worldFresh.arts > 0 &&
      obs.worldFresh.shadowed === obs.worldFresh.arts &&
      obs.worldFresh.filtered === obs.worldFresh.arts &&
      obs.chaptersFresh.arts > 0 &&
      obs.chaptersFresh.shadowed === obs.chaptersFresh.arts &&
      obs.mapFresh.arts > 0 &&
      obs.mapFresh.shadowed === obs.mapFresh.arts &&
      obs.mapFresh.marks === 0 &&
      // cleared: boss portrait revealed, exactly the 2 cleared nodes marked
      obs.mapCleared.shadowed === 0 &&
      obs.mapCleared.marks === 2 &&
      obs.chaptersCleared.shadowed === obs.chaptersCleared.arts - 1 &&
      obs.worldCleared.shadowed === obs.worldCleared.arts - 1 &&
      // battle screen: hero + villain, neither shadowed
      obs.battle.arts >= 2 &&
      obs.battle.shadowed === 0 &&
      // and no screen scrolls in either state
      [obs.worldOvfFresh, obs.chaptersOvfFresh, obs.mapOvfFresh,
       obs.worldOvfCleared, obs.chaptersOvfCleared, obs.mapOvfCleared]
        .every((o) => o.x <= 0 && o.y <= 0)
    check('shadow-art-hides-until-cleared', ok, `threw=${threw} ${JSON.stringify(obs)}`)
  }
