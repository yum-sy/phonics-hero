<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>probe</title>
<link rel="stylesheet" href="/src/style.css" />
<div id="app"></div>
<script type="module">
  import { renderMap, renderWorldSelect, renderChapterSelect } from '/src/screens.js'

  // Layout/screenshot harness. Read the verdict from `data-probe` (also the
  // document title and the on-screen HUD):
  //   CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  //   "$CH" --headless --disable-gpu --window-size=834,1281 \
  //     --virtual-time-budget=6000 --dump-dom \
  //     "http://localhost:5173/_probe.html?shot=long3"
  // Portrait is 834,1281 and landscape 1194,921 -- NOT the iPad's own
  // 834x1194, because headless Chrome's window chrome takes 87px off
  // innerHeight (see CLAUDE.md). Two more, both of which have cost a
  // misdiagnosis: an unknown ?shot= renders nothing and still reports
  // `NOSCROLL gap=100%`, so always read `on=[...]`; and there is no `timeout`
  // (or `gtimeout`) command on this Mac, so `timeout 200 "$CH" ...` exits 127
  // without launching Chrome and looks identical to a hung run.
  //
  // TOOLBAR SIMULATION -- the run that matters, added after two on-device
  // scroll reports (reward screen, chapter select) that the suite above
  // passed cleanly. On the iPad the browser's tab strip + address bar eat
  // 100-130px of the 1194, and they collapse on scroll, so the layout has to
  // fit the SMALL viewport. Headless Chrome has no dynamic toolbar, so
  // `svh == dvh == vh == 100%` here and the defect is structurally
  // unreproducible at the normal window size. It IS reproducible by taking
  // the toolbar off the window instead, because once the CSS is written in
  // `svh` a headless run at innerHeight = H is an exact model of a device
  // whose small viewport is H:
  //   portrait  834,1151   (innerHeight 1064 = 1194 - 130)
  //   landscape 1194,791   (innerHeight  704 =  834 - 130)
  // The verdict line reports `svh=` (100svh resolved) and `tb=` (how much of
  // the nominal device height is missing), so a toolbar run labels itself and
  // cannot be mistaken for a full-height one.
  //
  // RIGID=[...] is the static half of the same defect. The reward screen was
  // the only screen sized entirely in flat px, so its natural height was the
  // same 1129px at every viewport and it overflowed anything shorter -- and
  // no single-viewport metric could see that. RIGID lints the stylesheet
  // instead: a large flat-px font-size or box on a rendered element, with no
  // viewport/container/percentage term anywhere in the value, cannot shrink.
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const params = new URLSearchParams(location.search)
  const shot = params.get('shot') || 'world'

  // Fire onend immediately: a bare no-op stub never resolves audio.js's
  // queue promise, so every utterance fell back to its 2.5s safety timeout
  // and the whole harness ran far slower than the real app.
  window.speechSynthesis.speak = (u) => {
    setTimeout(() => u && typeof u.onend === 'function' && u.onend(), 0)
  }

  async function clickStage(chapterId, stageIndex) {
    renderMap(chapterId)
    await wait(120)
    const nodes = document.querySelectorAll('.stage-node[data-stage]')
    nodes[stageIndex].click()
  }

  // Click through beats to reach a specific beat kind. Beats advance via the
  // primary button; options are answered by clicking the correct choice.
  async function advanceTo(kindSel, maxSteps = 14) {
    for (let i = 0; i < maxSteps; i++) {
      if (document.querySelector(kindSel)) return true
      const next = document.querySelector('.primary-btn')
      if (next) { next.click(); await wait(160); continue }
      const opt = document.querySelector('.option-btn:not(:disabled)')
      if (opt) { opt.click(); await wait(160); continue }
      const tile = document.querySelector('.letter-tile:not(.used)')
      if (tile) { tile.click(); await wait(160); continue }
      await wait(120)
    }
    return !!document.querySelector(kindSel)
  }

  // Beat-kind shots work by isolating one beat at index 0 of a real stage
  // (the stage objects are live module state), instead of clicking through
  // the whole stage -- clicking depends on answering correctly and on the
  // audio-gated transition delays, and silently lands on the wrong beat.
  // Vite appends a cache-busting query (?t=...) to modules it has seen
  // change. Importing the plain path would then hand us a SECOND instance of
  // the chapter data -- we would mutate a copy the app never reads, the shot
  // would quietly fall back to the stage's real first beat, and the run would
  // report a confident PASS for a screen it never rendered. So resolve the
  // specifier screens.js itself imports.
  async function dataModule() {
    try {
      const src = await (await fetch('/src/screens.js')).text()
      const m = src.match(/from\s+['"]([^'"]*chapters\/index\.js[^'"]*)['"]/)
      if (m) return await import(new URL(m[1], location.origin + '/src/').href)
    } catch {}
    return await import('/src/data/chapters/index.js')
  }
  const { getStageById, stages: __allStages } = await dataModule()
  async function stateModule() {
    try {
      const src = await (await fetch('/src/screens.js')).text()
      const m = src.match(/from\s+['"]([^'"]*state\.js[^'"]*)['"]/)
      if (m) return await import(new URL(m[1], location.origin + '/src/').href)
    } catch {}
    return await import('/src/state.js')
  }
  const { markStageCleared } = await stateModule()

  // Stage ids carry the chapter number as a `cN` prefix (bare `stage-N` ids
  // are legacy chapter-1). Generalized so new chapters don't need a new
  // branch here every time one is added.
  function chapterIdFor(stageId) {
    const m = stageId.match(/^c(\d+)/)
    return m ? `chapter-${m[1]}` : 'chapter-1'
  }

  let wantKind = null
  async function isolate(stageId, kind, nth = 0) {
    wantKind = kind
    const stage = getStageById(stageId)
    const picks = stage.beats.filter((b) => b.kind === kind)
    if (!picks.length) throw new Error(`no ${kind} beat in ${stageId}`)
    stage.beats = [picks[Math.min(nth, picks.length - 1)]]
    // withGeneratedReview() (screens.js) splices an auto-generated review beat
    // back in whenever stage.reviewTargets exists and chapter.order > 8 --
    // even after beats was just overwritten to the one beat we want above --
    // so for chapter 9+ this measured the injected review choose beat instead
    // of the requested kind (86 WRONG-BEAT results across a chapter 15-33
    // sweep before this was found). ?reward= already carried this same null-out;
    // isolate() didn't. Only mutates this in-memory probe run, never the real
    // app's chapters/index.js stage object.
    stage.reviewTargets = null
    const idx = Number(stageId.replace(/\D/g, '').slice(-1)) - 1
    await clickStage(chapterIdFor(stageId), idx)
  }

  // The 합체 intro used to hand itself off after 1650ms, so every `*after`
  // shot just waited it out. It no longer does -- the child taps the combined
  // form to continue (QA: nobody got to look at it) -- and the wait alone now
  // leaves the intro on screen. That mattered quietly rather than loudly: the
  // census counts `.beat-equation` with querySelectorAll, and the equation
  // element exists inside `teach-content` while that div is still
  // display:none, so all seven `*after` shots kept reporting
  // `beat-equation=1` and NOSCROLL for a screen they had stopped rendering.
  // The equation beat is the tallest form in the app, so those seven were the
  // suite's whole coverage of it.
  //
  // Throwing when the intro is absent is the point: an intro that stops
  // existing (renamed id, reordered render) has to break the shot instead of
  // downgrading it to "measured the intro again".
  async function dismissIntro() {
    const intro = document.getElementById('boss-intro')
    if (!intro) throw new Error('dismissIntro: no #boss-intro to tap through')
    // onTap() listens for pointerdown AND click, suppressing the click only
    // when a real pointerup preceded it -- a synthetic click has no
    // pointerup, so this takes the click path.
    intro.click()
    await wait(200)
    if (document.getElementById('boss-intro')) {
      throw new Error('dismissIntro: intro survived the tap')
    }
  }

  async function emptyStage(stageId) {
    const stage = getStageById(stageId)
    stage.beats = []
    // Same withGeneratedReview() reinjection isolate() guards against above --
    // emptyStage() only had callers in chapters <= 8 so far (reviewTargets is
    // gated to chapter.order > 8), but guard it here too so a future chapter
    // 9+ caller doesn't silently reintroduce the same bug.
    stage.reviewTargets = null
    const idx = Number(stageId.replace(/\D/g, '').slice(-1)) - 1
    await clickStage(chapterIdFor(stageId), idx)
  }

  const SHOTS = {
    world: () => renderWorldSelect(),
    chapters: () => renderChapterSelect('world-1'),
    map1: () => renderMap('chapter-1'),
    map2: () => renderMap('chapter-2'),
    map3: () => renderMap('chapter-3'),
    map4: () => renderMap('chapter-4'),
    battle1: () => isolate('stage-2', 'teach'),
    battle2: () => isolate('c2-stage-2', 'teach'),
    battle3: () => isolate('c3-stage-2', 'teach'),
    battle4: () => isolate('c4-stage-2', 'teach'),
    boss3: () => clickStage('chapter-3', 4),
    boss1: () => clickStage('chapter-1', 4),
    boss1after: async () => { await clickStage('chapter-1', 4); await wait(1700); await dismissIntro() },
    boss2: () => clickStage('chapter-2', 4),
    boss4: () => clickStage('chapter-4', 4),
    boss4after: async () => { await clickStage('chapter-4', 4); await wait(1700); await dismissIntro() },
    reward4: () => emptyStage('c4-stage-1'),
    // The reward screen's only real-world scroll report (QA, on-device):
    // chapter 33's final-boss recapKo is 108 characters and wraps to 6
    // lines, overflowing the viewport by 225px. reward33 is that exact
    // stage's reward screen; reward4d is a 104-character recapKo (chapter
    // 4's stage 4) that wraps to only 3 lines despite being nearly as long
    // -- word-wrap of mixed Korean/English text is not linear in character
    // count, so both ends of that gap need their own shot rather than
    // trusting one to stand in for the other. Both are chapters past
    // HAND_AUTHORED_MAX_CHAPTER_ORDER-worth of progression, and
    // DEV_UNLOCK_ALL is off (see state.js), so the target stage's node is
    // locked on a fresh load -- mark every other stage cleared first so
    // clickStage() can actually reach it.
    reward4d: async () => {
      __allStages.forEach((s) => { if (s.id !== 'c4-stage-4') markStageCleared(s.id, 3) })
      await emptyStage('c4-stage-4')
    },
    reward33: async () => {
      __allStages.forEach((s) => { if (s.id !== 'c33s5') markStageCleared(s.id, 3) })
      const stage = getStageById('c33s5')
      stage.beats = []
      // withGeneratedReview() (screens.js) splices in a review beat whenever
      // stage.reviewTargets exists and chapter.order > 8, even after beats
      // was just emptied above -- chapter 33 has reviewTargets, so without
      // this it would still render a choose-sequence instead of jumping
      // straight to the reward screen. Only affects this in-memory probe
      // run, never the real app (chapters/index.js's own stage object).
      stage.reviewTargets = null
      await clickStage('chapter-33', 4)
      await wait(1700)
      if (document.getElementById('boss-intro')) await dismissIntro()
      await wait(300)
    },
    // Chapters 5-7 had no coverage at all, so a layout regression in the
    // newest three chapters' art families could not be measured. An
    // unknown shot renders nothing and still reports NOSCROLL gap=100%,
    // which reads like a pass -- see `on=[none|-]` in the HUD.
    map5: () => renderMap('chapter-5'),
    map6: () => renderMap('chapter-6'),
    map7: () => renderMap('chapter-7'),
    battle5: () => isolate('c5-stage-2', 'teach'),
    battle6: () => isolate('c6-stage-2', 'teach'),
    battle7: () => isolate('c7-stage-2', 'teach'),
    boss5: () => clickStage('chapter-5', 4),
    boss6: () => clickStage('chapter-6', 4),
    boss7: () => clickStage('chapter-7', 4),
    boss6after: async () => { await clickStage('chapter-6', 4); await wait(1700); await dismissIntro() },
    boss7after: async () => { await clickStage('chapter-7', 4); await wait(1700); await dismissIntro() },
    // Chapter 8 (world 2, Jolly group 5: IE/EE/OR) had zero coverage --
    // exactly the gap this file's own comments warn about for 5-7 before they
    // got shots. It is also the app's first TWO-WORD boss with TWO two-slot
    // digraph targets (T+IE=TIE, C+OR+N=CORN), so boss8after exercises a case
    // the other six chapters don't: two stacked equations where one target
    // has a digraph in a non-first slot.
    map8: () => renderMap('chapter-8'),
    battle8: () => isolate('c8-stage-2', 'teach'),
    boss8: () => clickStage('chapter-8', 4),
    boss8after: async () => { await clickStage('chapter-8', 4); await wait(1700); await dismissIntro() },
    build8: () => isolate('c8-stage-5', 'drag-build', 1),
    // The screen right after the 합체 intro is the boss stage's teach beat,
    // which is the only place the letter equation ("S + A + T = SAT") renders.
    // Chapters 3-7 build two words there, so the equation is two lines and is
    // the tallest form -- every chapter needs its own shot or the two-line
    // case goes unmeasured.
    boss2after: async () => { await clickStage('chapter-2', 4); await wait(1700); await dismissIntro() },
    boss3after: async () => { await clickStage('chapter-3', 4); await wait(1700); await dismissIntro() },
    boss5after: async () => { await clickStage('chapter-5', 4); await wait(1700); await dismissIntro() },
    // chapter 7 is the first with array-slot drag-build targets (['R','AI','N'])
    build7: () => isolate('c7-stage-5', 'drag-build'),
    shape6: () => isolate('c6-stage-4', 'match-shape'),
    // Icon-contrast checks: real choose/multiselect beats that mix the 13
    // new icons (cat/hen/egg/hat/key/elephant/hand/king/cake/horse/kite/
    // ten/bed) with older ones, inside the real .options-grid/.option-btn
    // markup and beat background -- not a synthetic swatch page.
    icons3: () => isolate('c3-stage-4', 'choose', 1), // hat / hen / egg
    // Option labels long enough to wrap to two lines. No shot exercised one,
    // so nothing could see a wrapped label eating the icon's height: the
    // worst 3-option case is orange/octopus/umbrella and the worst
    // 4-option case is octopus/umbrella/orange/gift.
    long3: () => isolate('c5-stage-4', 'choose', 1),
    long4: () => isolate('c7-stage-3', 'multiselect'),
    icons3multi: () => isolate('c3-stage-4', 'multiselect'), // hat / cat / hen / horse
    icons4multi: () => isolate('c4-stage-3', 'multiselect'), // cat / egg / key / cake
    teach2: () => isolate('c2-stage-2', 'teach'),
    // Korean -> English transition (src/data/language-policy.js): chapter 6
    // is the first bilingual chapter (English primary + Korean subtitle on
    // the families that switched), 7 has every family bilingual, 9 is
    // mid-fade, 20 is English only. The subtitle adds a line under the
    // instruction, so these are the screens whose vertical budget changed.
    lang6c: () => isolate('c6-stage-2', 'choose'),
    lang6t: () => isolate('c6-stage-2', 'teach'),
    lang6b: () => isolate('c6-stage-2', 'break'),
    lang7m: () => isolate('c7-stage-3', 'multiselect'),
    lang9c: () => isolate('c9-stage-2', 'choose'),
    lang20t: () => isolate('c20-stage-1', 'teach'),
    reward6: () => emptyStage('c6-stage-1'),
    reward16: async () => {
      __allStages.forEach((s) => { if (s.id !== 'c16-stage-1') markStageCleared(s.id, 3) })
      await emptyStage('c16-stage-1')
    },
    break1: () => isolate('stage-2', 'break'),
    choose2: () => isolate('c2-stage-2', 'choose'),
    choose2b: () => isolate('c2-stage-2', 'choose', 2),
    chooseseq1: () => isolate('stage-4', 'choose-sequence'),
    multi1: () => isolate('stage-2', 'multiselect'),
    multi2: () => isolate('c2-stage-2', 'multiselect'),
    build1: () => isolate('stage-5', 'drag-build'),
    build2: () => isolate('c2-stage-5', 'drag-build'),
    build2c: () => isolate('c2-stage-5', 'drag-build', 2),
    listen1: () => isolate('stage-2', 'listen-repeat'),
    finale1: () => isolate('stage-1', 'finale'),
    finale2: () => isolate('c2-stage-5', 'finale'),
    reward1: () => emptyStage('stage-1'),
    // ---- feedback-FX states -------------------------------------------
    // These four exist because every one of them is a class applied by
    // screens.js at a moment the flow does not hold still for, so none of
    // them is reachable from a plain ?shot=. They are transforms and
    // fixed/animated boxes over screens that already pass, which is exactly
    // the shape of a regression the suite would otherwise miss: transformed
    // and scaled boxes DO count toward scrollable overflow, so an FX pose
    // can push a passing screen into SCROLL without changing any layout box.
    //
    // Not folded into the 53: that count is the sign-off for the app's real
    // screens, and these are overlays on five of them.

    // .fx-bolt mid-flight over a real battle beat. Coordinates are taken
    // from the actual button and villain rects, so the element is measured
    // where screens.js will really put it -- a hand-picked pair of numbers
    // could sit safely inside the viewport by luck.
    fxbolt: async () => {
      await isolate('c2-stage-2', 'choose')
      const btn = document.querySelector('.option-btn')
      const vil = document.querySelector('.villain-sprite')
      if (!btn || !vil) throw new Error('fxbolt: no button or villain to aim between')
      const b = btn.getBoundingClientRect()
      const v = vil.getBoundingClientRect()
      const fx = document.createElement('div')
      fx.className = 'fx-bolt'
      fx.style.cssText =
        `--fx-x1:${b.left + b.width / 2}px;--fx-y1:${b.top + b.height / 2}px;` +
        `--fx-x2:${v.left + v.width / 2}px;--fx-y2:${v.top + v.height / 2}px`
      document.body.appendChild(fx)
      await wait(40)
    },
    // Combined form waiting to be tapped -- the state the intro now rests in
    // indefinitely. The class is NOT added here: screens.js adds it on its own
    // timer, so this measures the real thing and fails loudly if that wiring
    // goes away, rather than measuring a pose only the harness ever produces.
    invite: async () => {
      await clickStage('chapter-1', 4)
      await wait(1900)
      const hero = document.querySelector('.boss-intro-hero.combine-invite')
      if (!hero) throw new Error('invite: combine-invite never applied')
      await wait(40)
    },
    // Boss result with the victory tableau. The scaled/leaning sprites are
    // the reason this needs its own shot: reward1 measures the layout boxes,
    // this measures where the poses actually paint.
    victory: async () => {
      await emptyStage('stage-1')
      // Asserted, not applied: renderReward() emits both classes itself, so a
      // shot that added them would keep passing after the markup dropped them
      // and would be measuring a pose only the harness produces.
      if (!document.querySelector('.reward-hero.reward-victor')) {
        throw new Error('victory: hero is not .reward-victor')
      }
      if (!document.querySelector('.reward-villain.reward-defeated')) {
        throw new Error('victory: villain is not .reward-defeated')
      }
      await wait(40)
    },
    // Wrong-order slot plus the pulsing Undo, together, because they are one
    // moment: the pulse scales the button 1.06 at the same time.
    buildwrong: async () => {
      await isolate('c7-stage-5', 'drag-build')
      const slots = document.querySelectorAll('.build-slot')
      const tiles = document.querySelectorAll('.letter-tile:not(.used)')
      // One short of full on purpose. Filling the last slot triggers grading,
      // which either advances the beat or clears the row -- either way the
      // shot would no longer be showing the state it is named for.
      for (let i = 0; i < slots.length - 1 && i < tiles.length; i++) tiles[i].click()
      await wait(200)
      slots[0]?.classList.add('wrong')
      document.querySelector('.secondary-btn')?.classList.add('hint-pulse')
      await wait(40)
    },

    // Visual-only checks for states the normal flow won't hold still for.
    recovery: () => {
      document.querySelector('#app').innerHTML = `
        <div class="screen stage-screen">
          <button class="back-btn">\u25c0 \ub098\uac00\uae30</button>
          <div class="beat recovery-beat">
            <div class="beat-emoji">\ud83e\uddf8</div>
            <div class="beat-instruction">\uc7a0\uc2dc \uc26c\uc5c8\ub2e4 \uac00\uc790!<br>\ub2e4\uc2dc \ud574\ubcfc\uae4c\uc694?</div>
            <div class="beat-feedback">\uc9c0\ub3c4\ub85c \ub3cc\uc544\uac00\uc11c \ub2e4\uc2dc \uace0\ub97c \uc218 \uc788\uc5b4\uc694</div>
            <button class="primary-btn">\ub2e4\uc2dc \ud574\ubcfc\uae4c\uc694 \u25b6</button>
            <button class="secondary-btn">\uc9c0\ub3c4\ub85c</button>
          </div>
        </div>`
    },
  }

  // ---- what did the shot actually draw? ----------------------------------
  // The failure mode this exists for has now cost three misdiagnoses, and it
  // is always the same shape: a shot stops reaching its screen, renders
  // something else (or nothing), and reports `NOSCROLL` -- which reads as a
  // pass. An unknown ?shot= renders nothing and reports `NOSCROLL gap=100%`.
  // `boss1after`..`boss7after` spent a whole round measuring the 합체 intro
  // after the auto-advance they waited on was replaced by a tap. A green HUD
  // was the only thing anyone looked at in both cases.
  //
  // `on=[...]` and the census were the intended defence and they were not
  // enough, for two reasons that are both fixed here:
  //
  //   1. The census counted with querySelectorAll, which counts elements
  //      inside `display:none`. `.beat-equation` lives in `#teach-content`,
  //      hidden while the intro plays, so all seven `*after` shots reported
  //      `beat-equation=1` for a screen that was not showing it. The census
  //      is VISIBILITY-FILTERED now, so that number would have been 0.
  //   2. Reading it was left to a human. A shot now DECLARES what must be on
  //      screen and what must not, and the verdict line carries the failure
  //      as loudly as SCROLL does. A named shot with no declaration is itself
  //      reported (`*** NO-EXPECT`), so the next shot added cannot inherit
  //      the old silence.
  //
  // `has` is "at least one of these is visible", `not` is "none of these is
  // visible". Both are cheap; the point is that they are mandatory.
  const EXPECT = {
    // Two screens share `.chapter-select-screen`, so the card's data
    // attribute is the only thing that tells them apart.
    world: { has: ['.chapter-card[data-world]'], not: ['.back-btn', '.chapter-card[data-chapter]'] },
    chapters: { has: ['.chapter-card[data-chapter]', '#back-to-worlds'], not: ['.chapter-card[data-world]'] },
    // ---- boss 합체 intro, resting on screen waiting for the tap ----------
    // `.mini-bot` is the lineup and `#boss-intro` is the tap target. The
    // equation must NOT be visible: these shots measure the intro, and if the
    // intro ever starts auto-advancing again these are the shots that have to
    // notice.
    //
    // Read their `bgap` as a MID-ANIMATION number, not against the 8%
    // baseline. These shots measure at the default 260ms delay, when the
    // third mini-bot (--slide-delay 260ms) has not arrived and the hero is
    // still scale(0) -- portrait reports 17.3% void and `mini=2`. That is the
    // animation, not a layout defect. The intro's RESTING state is the
    // `invite` shot (5.3% landscape / 6.4% portrait), which is the one to
    // compare against the baseline.
    //
    // A single red HUD on a boss*/boss*after shot is NOT evidence of a
    // regression by itself: EXPECT-FAIL[-.mini-bot] on these was reproduced
    // by re-running the SAME shot back to back with nothing else changed,
    // firing on roughly a third of runs across all seven (now eight)
    // chapters and BOTH orientations (not just landscape, not just one art
    // family) -- e.g. boss3/boss5/boss6/boss7 landscape and boss5/boss7
    // portrait all flipped to EXPECT-FAIL on a repeat with no code changed in
    // between. Headless Chrome's virtual-time-budget clock and the mini-bot's
    // real CSS transform animation (mini-slide-left/right, 0.28s + up to
    // 260ms of --slide-delay stagger) are not the same clock, so the fixed
    // `wait(260)` before measuring sometimes lands the sample squarely inside
    // a frame where the sliding bot's transform has not resolved to a
    // nonzero, in-bounds box yet. A `.mini-bot` this catches mid-transform
    // can measure as small as 40x40 (vs. its 132px CSS size) or with no
    // client rects at all, both of which are exactly what `visible()`/`seen()`
    // are supposed to catch on a REAL defect -- there is no cheap signal here
    // that tells the two cases apart. Treat one flagged boss*/boss*after run
    // as inconclusive and re-run it 2-3x before calling it a regression; a
    // repeated failure on the SAME chapter+orientation while every other
    // chapter passes repeatedly would be the actual signal.
    ...Object.fromEntries(
      [1, 2, 3, 4, 5, 6, 7, 8].map((n) => [
        `boss${n}`,
        { has: ['#boss-intro', '.boss-intro-hero', '.mini-bot', '.fusion-sound-strip', '.fusion-sound'], not: ['.beat-equation'] },
      ])
    ),
    // ---- the screen after the tap: the letter equation -------------------
    // The tallest form in the app, and these seven shots are its only
    // coverage. `not: ['#boss-intro']` is the assertion that dismissIntro()
    // actually did something.
    ...Object.fromEntries(
      [1, 2, 3, 4, 5, 6, 7, 8].map((n) => [
        `boss${n}after`,
        { has: ['.beat-equation', '#continue-btn', '.beat-instruction'], not: ['#boss-intro', '.mini-bot'] },
      ])
    ),
    ...Object.fromEntries(
      [1, 2, 3, 4, 5, 6, 7, 8].map((n) => [
        `map${n}`,
        { has: ['.map-screen', '.stage-node', '#back-to-chapters'], not: ['.beat'] },
      ])
    ),
    // The star row is gone; `not` is what keeps it gone. Its height was
    // redistributed into the sprites and into slack for the victory pose.
    reward1: { has: ['.reward-screen', '.reward-title', '.reward-hero.reward-victor', '.reward-villain.reward-defeated'], not: ['.stars-row'] },
    reward4: { has: ['.reward-screen', '.reward-title', '.reward-hero.reward-victor', '.reward-villain.reward-defeated'], not: ['.stars-row'] },
    reward4d: { has: ['.reward-screen', '.reward-title', '.reward-hero.reward-victor', '.reward-villain.reward-defeated'], not: ['.stars-row'] },
    reward33: { has: ['.reward-screen', '.reward-title', '.reward-hero.reward-victor', '.reward-villain.reward-defeated'], not: ['.stars-row'] },
    // Korean -> English transition reward screens (chapter 6 bilingual phase,
    // chapter 16 English-only).
    reward6: { has: ['.reward-screen', '.reward-title', '.recap-line'], not: ['.stars-row'] },
    reward16: { has: ['.reward-screen', '.reward-title', '.recap-line'], not: ['.stars-row'] },
    victory: { has: ['.reward-hero.reward-victor', '.reward-villain.reward-defeated'], not: ['.stars-row'] },
    // #boss-intro-hint is `visibility:hidden` until the invite timer fires,
    // and the visibility filter is what makes requiring it meaningful: this
    // is the shot that fails if anything ever swallows that timer again
    // (a harness helper used to, which is why it no longer exists).
    invite: { has: ['#boss-intro', '.boss-intro-hero.combine-invite', '#boss-intro-hint'], not: ['.beat-equation'] },
    fxbolt: { has: ['.fx-bolt', '.options-grid'], not: [] },
    buildwrong: { has: ['.build-slot.wrong', '.secondary-btn.hint-pulse', '.build-slots'], not: [] },
    recovery: { has: ['.recovery-beat', '.primary-btn', '.secondary-btn'], not: ['.battle-scene'] },
  }

  // Visible means "occupies space and is not transparent or
  // visibility:hidden" -- the same three tests the measurement pass uses, so
  // a declaration cannot pass on an element the gap metric is ignoring.
  function visible(el) {
    if (!el.getClientRects().length) return false
    const cs = getComputedStyle(el)
    return cs.visibility !== 'hidden' && cs.opacity !== '0'
  }
  const seen = (q) => {
    try { return Array.from(document.querySelectorAll(q)).filter(visible).length }
    catch { return -1 } // malformed selector: report it rather than pass it
  }

  // Returns the list of violated clauses. `wantKind` (set by isolate()) is
  // itself a declaration, so beat-kind shots are covered without repeating
  // their selectors here.
  function expectFailures(name) {
    const e = EXPECT[name]
    if (!e) return wantKind ? [] : ['NO-EXPECT']
    const bad = []
    for (const q of e.has) if (seen(q) < 1) bad.push(`-${q}`)
    for (const q of e.not) if (seen(q) > 0) bad.push(`+${q}`)
    return bad
  }

  // ---- measurement -------------------------------------------------------
  function paints(el, cs) {
    if (el.tagName === 'svg' || el.tagName === 'IMG') return true
    if (cs.backgroundImage !== 'none') return true
    const bg = cs.backgroundColor
    if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') return true
    if (parseFloat(cs.borderTopWidth) > 0 || parseFloat(cs.borderBottomWidth) > 0) return true
    // A leaf with text, or an element whose OWN text nodes carry the text
    // even though it also has an element child -- e.g. the stage label
    // "Power of <span>S</span>", which used to read as unpainted (and so
    // inflated the reported gap by a whole label's height) purely because
    // one glyph is wrapped for colouring.
    const ownsText = Array.from(el.childNodes).some(
      (n) => n.nodeType === 3 && n.textContent.trim().length
    )
    if (ownsText) return true
    if (el.children.length === 0 && el.textContent.trim().length) return true
    return false
  }

  // clientWidth already drops the border but keeps the padding, and it is
  // rounded -- comparing a fractional child width against it reported
  // 196 > 200 as a spill. Compute the content box from the fractional rect.
  function contentW(el, cs) {
    return (
      el.getBoundingClientRect().width -
      parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) -
      parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth)
    )
  }

  // 100svh in px. Equal to innerHeight in headless (no dynamic toolbar), so
  // this is not a check of svh support -- it is what makes a reduced-window
  // run self-labelling: `tb` is the slice of the nominal device height that
  // the run is pretending the browser UI took.
  function svhPx() {
    const d = document.createElement('div')
    d.setAttribute('style', 'position:absolute;top:0;left:0;width:1px;height:100svh;visibility:hidden')
    document.body.appendChild(d)
    const h = Math.round(d.getBoundingClientRect().height)
    d.remove()
    return h
  }

  // Flat-px sizes that cannot shrink when the viewport does. Reads the
  // stylesheet rather than computed style, because a computed 100px says
  // nothing about whether it came from a clamp with a viewport term. Only
  // rules that match something rendered are reported, so a shot is judged on
  // the screen it actually drew.
  const RIGID_PROPS = { 'font-size': 48, width: 120, height: 120, 'max-height': 200, gap: 40 }
  function rigid() {
    const out = []
    for (const sheet of document.styleSheets) {
      let rules
      try { rules = sheet.cssRules } catch { continue }
      if (!rules) continue
      // Index loop, not for..of: CSSRuleList is a legacy array-like, not a
      // declared iterable. And `r.cssRules && ... continue` would skip every
      // rule in the sheet -- since nested CSS shipped, a plain CSSStyleRule
      // also carries a cssRules list (empty, but an object, so truthy), so
      // that shape reported zero findings on a stylesheet full of them.
      const walk = (list) => {
        for (let i = 0; i < list.length; i++) {
          const r = list[i]
          // A media block that does not apply to THIS orientation is not a
          // finding: the landscape overrides are flat px on purpose and are
          // measured by the landscape run.
          if (r.cssRules && r.cssRules.length) {
            if (r.conditionText && !window.matchMedia(r.conditionText).matches) continue
            walk(r.cssRules)
          }
          if (!r.selectorText || !r.style) continue
          // Report the selector that ACTUALLY matched, not the rule's first
          // one. `.replay-btn, .primary-btn, .mic-btn { font-size: 50px }`
          // matched on the reward screen -- which has a .primary-btn and no
          // .replay-btn at all -- and the finding read `.replay-btn{...}`,
          // sending anyone who checked it looking for an element that is not
          // on the screen. A finding that names the wrong element is a finding
          // that gets dismissed.
          let hit = null
          for (const part of r.selectorText.split(',')) {
            const q = part.replace(/:(active|hover|focus|disabled|empty)\b/g, '').trim()
            if (!q) continue
            try { if (document.querySelector(q)) { hit = q; break } } catch {}
          }
          if (!hit) continue
          for (const [prop, floor] of Object.entries(RIGID_PROPS)) {
            const v = r.style.getPropertyValue(prop)
            if (!v) continue
            // Anything elastic disqualifies the declaration from being rigid.
            if (/svh|dvh|lvh|vh|vw|vmin|vmax|cq[whbi]|%|auto|min-content|max-content|fr/.test(v)) continue
            const px = parseFloat(v)
            if (!(px >= floor)) continue
            out.push(`${hit}{${prop}:${v.trim()}}`)
          }
        }
      }
      walk(rules)
    }
    return out
  }

  function measure() {
    const de = document.documentElement
    const vh = window.innerHeight
    const vw = window.innerWidth
    const overflowY = Math.max(de.scrollHeight, document.body.scrollHeight) - vh
    const overflowX = Math.max(de.scrollWidth, document.body.scrollWidth) - vw
    const spans = []
    for (const el of document.querySelectorAll('#app *')) {
      const cs = getComputedStyle(el)
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') continue
      if (cs.position === 'fixed') continue // full-bleed flash overlay would mask every gap
      if (!el.getClientRects().length) continue
      const r = el.getBoundingClientRect()
      if (r.height < 1 || r.width < 1) continue
      if (!paints(el, cs)) continue
      // Screen-level colour fields cover the whole viewport, so counting them
      // as "content" would report every screen as 0% empty. Anything covering
      // more than half the viewport is a background, not content.
      if (el.matches('.screen') || r.width * r.height > 0.85 * vw * vh) continue
      spans.push([Math.max(0, r.top), Math.min(vh, r.bottom)])
    }
    spans.sort((a, b) => a[0] - b[0])
    const merged = []
    for (const s of spans) {
      const last = merged[merged.length - 1]
      if (last && s[0] <= last[1] + 1) last[1] = Math.max(last[1], s[1])
      else merged.push([...s])
    }
    let gap = 0
    let gapAt = 0
    let cursor = 0
    for (const [top, bottom] of merged) {
      if (top - cursor > gap) { gap = top - cursor; gapAt = cursor }
      cursor = Math.max(cursor, bottom)
    }
    if (vh - cursor > gap) { gap = vh - cursor; gapAt = cursor }
    return { vw, vh, overflowY, overflowX, gap: Math.round(gap), gapAt: Math.round(gapAt), pct: (gap / vh * 100).toFixed(1) }
  }

  // The viewport gap metric is BLIND in landscape: the battle scene is a
  // full-height side rail, so its painted band covers y=12..818 and masks
  // every void inside the beat column beside it. icons3 reported
  // gap=16px(1.9%) in landscape while its beat column actually held 486px of
  // void -- 60% of the column -- which is worse than the portrait 10.5% that
  // was being chased. So voids also get measured INSIDE .beat's own box,
  // over .beat's painted descendants only. `bgap` is the number to trust for
  // any beat screen; `gap` only ever sees whichever column is tallest.
  function beatVoid() {
    const beat = document.querySelector('.beat')
    if (!beat) return null
    const box = beat.getBoundingClientRect()
    if (box.height < 1) return null
    const spans = []
    for (const el of beat.querySelectorAll('*')) {
      const cs = getComputedStyle(el)
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') continue
      if (cs.position === 'fixed' || cs.position === 'absolute') continue
      if (!el.getClientRects().length) continue
      const r = el.getBoundingClientRect()
      if (r.height < 1 || r.width < 1) continue
      if (!paints(el, cs)) continue
      spans.push([Math.max(box.top, r.top), Math.min(box.bottom, r.bottom)])
    }
    spans.sort((a, b) => a[0] - b[0])
    let gap = 0
    let at = 0
    let cursor = box.top
    for (const [top, bottom] of spans) {
      if (top - cursor > gap) { gap = top - cursor; at = cursor }
      cursor = Math.max(cursor, bottom)
    }
    if (box.bottom - cursor > gap) { gap = box.bottom - cursor; at = cursor }
    return {
      h: Math.round(box.height),
      gap: Math.round(gap),
      at: Math.round(at),
      pct: (gap / box.height * 100).toFixed(1),
    }
  }

  // ?opts=N clones option buttons up to N. Chapters 8-33 want 4-5 choices to
  // raise the difficulty, but no chapter ships 5 yet, so without this there
  // is no way to find out whether 5 even fits before the content is written.
  // Clones are real .option-btn markup inside the real grid, so every count
  // rule (:has(> :nth-child(N))) and every icon-sizing rule applies exactly
  // as it would to authored data.
  function padOptions(n) {
    const grid = document.querySelector('.options-grid')
    if (!grid) return
    const btns = Array.from(grid.querySelectorAll('.option-btn'))
    if (!btns.length) return
    for (let i = btns.length; i < n; i++) {
      const c = btns[i % btns.length].cloneNode(true)
      c.dataset.id = `pad-${i}`
      grid.appendChild(c)
    }
    while (grid.querySelectorAll('.option-btn').length > n) {
      grid.querySelector('.option-btn:last-child').remove()
    }
  }

  // `?hold=` and its holdIntro() are GONE, and the reason is worth keeping:
  // the whole function existed to stop the 1650ms timer so the intro would
  // stay on screen to be measured. The intro no longer times out at all (it
  // waits for a tap), so the hold is what the app does by itself -- but the
  // 1650ms interception outlived its purpose and became actively wrong,
  // because that timer now adds `.combine-invite` and un-hides the tap hint.
  // Swallowing it produced an intro frame with no invitation in it, i.e. a
  // frame the child never sees, measured as if it were the resting state.
  // The early pre-emerge frames it also offered are reachable without it:
  // `--virtual-time-budget=700` stops the virtual clock before the hero
  // emerges. Use the `invite` shot for the resting state.

  // How much bigger can the text get? The gap metric cannot answer that:
  // every screen's column is `flex: 1` with `space-evenly`, so it always
  // reports as filled right up to the frame where it suddenly overflows.
  // ?nat=1 switches off the stretching so the column collapses to the
  // height its content actually needs; `nat` vs `vh` is then the real
  // headroom, and vh/nat is the largest uniform scale-up that still fits.
  function naturalMode() {
    const s = document.createElement('style')
    s.textContent = `
      #app { min-height: 0 !important; }
      .screen, .map-path, .chapter-grid, .chapter-card-art { flex: none !important; }
      /* Landscape turns .stage-screen into a ROW. Two consequences, both of
         which produced false readings before this split:
         (a) align-items defaults to stretch, so both columns were pinned to
             the viewport height and the reading was the battle rail's height,
             not the beat's -- 1.46x room on screens that overflowed by 76px;
         (b) the beat column's WIDTH comes from its flex, so zeroing that let
             it grow to 1416px, text stopped wrapping, and the height came out
             far too low. Hence the beat resets are portrait-only. */
      .stage-screen { align-items: flex-start !important; }
      @media (orientation: portrait) {
        .beat, .beat-area, .teach-content, .boss-intro { flex: none !important; }
      }
      .chapter-grid { grid-auto-rows: min-content !important; }`
    document.head.appendChild(s)
  }

  // ?css=<url-encoded CSS> appends a stylesheet before measuring, so a
  // candidate size can be swept across every shot without editing
  // style.css and reloading between each value. Whatever wins the sweep then
  // gets written into style.css and re-measured for real.
  function cssOverride(text) {
    const s = document.createElement('style')
    s.textContent = text
    document.head.appendChild(s)
  }

  async function run() {
    // ?unlock=1 marks every stage cleared before the shot runs, so a
    // clickStage()/isolate() shot can reach a stage past
    // HAND_AUTHORED_MAX_CHAPTER_ORDER-worth of progression even with
    // DEV_UNLOCK_ALL off (state.js, deliberately off so it doesn't leak into
    // an on-device build). Diagnostic-only: real progression is never
    // touched, this mutates only the in-memory stage list this probe run
    // imported.
    if (params.get('unlock')) __allStages.forEach((s) => markStageCleared(s.id, 3))
    if (params.get('css')) cssOverride(params.get('css'))
    if (params.get('nat')) naturalMode()
    // ?iso=<stageId>:<kind>[:nth] isolates any beat in the curriculum without
    // minting a named shot for it. The named SHOTS are the regression suite --
    // a fixed list whose count is part of the sign-off ("53 shots x 2
    // orientations") -- so adding ten one-off entries to chase one defect
    // across the beats that happen to contain it would dilute that number and
    // leave dead shots behind once the defect is gone. This runs the exact
    // same isolate() path, so an ad-hoc sweep and a suite shot measure the
    // same thing. Note that a MISSPELLED kind throws (isolate() checks), which
    // is the opposite of the ?shot= trap where an unknown name renders nothing
    // and still reports NOSCROLL gap=100%.
    const iso = params.get('iso')
    // ?reward=<stageId> is the generic form of reward33/reward4d above: jump
    // straight to any stage's reward screen without hand-writing a SHOTS
    // entry for it. Same recipe -- mark every other stage cleared so
    // clickStage() can reach a stage past DEV_UNLOCK_ALL's off progression,
    // empty the target's beats (and reviewTargets, which withGeneratedReview
    // would otherwise splice a review beat back in even after emptying), dismiss
    // the boss-combine intro if the target is a chapterBoss stage.
    const rewardStage = params.get('reward')
    // ?bosseq=<stageId> reaches the boss-intro's POST-tap equation screen
    // (buildEquationsHtml() in screens.js) with the stage's beats array left
    // intact -- unlike ?iso=, which overwrites stage.beats down to one beat
    // and so silently empties buildEquationsHtml's own input (it reads
    // stage.beats to find every drag-build target). A stage with two boss
    // words renders TWO stacked equation rows on this one screen with no
    // per-row-count vertical compensation in the CSS (the --eq-len rule only
    // sizes for single-line WIDTH, see style.css's .beat-equation comment),
    // so this is the one screen ?iso= structurally cannot reproduce.
    const bossEqStage = params.get('bosseq')
    if (iso) {
      const [sid, kind, nth] = iso.split(':')
      await isolate(sid, kind, Number(nth || 0))
    } else if (bossEqStage) {
      __allStages.forEach((s) => { if (s.id !== bossEqStage) markStageCleared(s.id, 3) })
      const idx = Number(bossEqStage.replace(/\D/g, '').slice(-1)) - 1
      await clickStage(chapterIdFor(bossEqStage), idx)
      await wait(400)
      if (document.getElementById('boss-intro')) await dismissIntro()
      await wait(200)
    } else if (rewardStage) {
      __allStages.forEach((s) => { if (s.id !== rewardStage) markStageCleared(s.id, 3) })
      const stage = getStageById(rewardStage)
      stage.beats = []
      stage.reviewTargets = null
      const idx = Number(rewardStage.replace(/\D/g, '').slice(-1)) - 1
      await clickStage(chapterIdFor(rewardStage), idx)
      await wait(1700)
      if (document.getElementById('boss-intro')) await dismissIntro()
      await wait(300)
    } else {
      const fn = SHOTS[shot]
      if (fn) await fn()
    }
    await wait(Number(params.get('delay') || 260))
    if (params.get('opts')) {
      padOptions(Number(params.get('opts')))
      await wait(60)
    }
    if (params.get('dis')) {
      document.querySelectorAll('.primary-btn, .replay-btn').forEach((b) => (b.disabled = true))
    }
    const m = measure()
    m.svh = svhPx()
    if (params.get('nat')) {
      // #app's own height, not body's. When html/body carried
      // `height: 100%` this was load-bearing -- body.scrollHeight reported
      // the viewport height straight back and every screen looked like it had
      // exactly 1.000x room. They are `min-height: 100svh` now (a percentage
      // height resolves against the LARGE viewport, which is what put the
      // whole document 84px past the visible area on the iPad), so body would
      // grow honestly -- but #app stays the right box to measure, since it is
      // the one the screens live in.
      const app = document.querySelector('#app')
      const nat = Math.max(app.scrollHeight, Math.round(app.getBoundingClientRect().height))
      m.nat = `${nat} room=${(m.vh / nat).toFixed(3)}x`
    }
    const verdict = m.overflowY > 0 || m.overflowX > 0 ? 'SCROLL' : 'NOSCROLL'
    const screenCls = (document.querySelector('#app > .screen') || {}).className || 'none'
    const beatCls = (document.querySelector('.beat') || {}).className || '-'
    // beat.kind -> the class the renderer actually emits
    const KIND_CLASS = {
      teach: 'teach-beat', break: 'teach-beat', choose: 'choose-beat',
      'choose-sequence': 'choose-beat', multiselect: 'multiselect-beat',
      'drag-build': 'build-beat', 'listen-repeat': 'listen-beat', finale: 'listen-beat',
      // match-shape is choose-beat minus sound-based speech, and reuses the
      // same class; without this entry shape6 reported *** WRONG-BEAT.
      'match-shape': 'choose-beat',
    }
    // Single-target listen/finale intentionally route to the shared attack UI.
    const attackRoute = ['listen-repeat', 'finale'].includes(wantKind) && beatCls.includes('attack-beat')
    const kindOk = !wantKind || attackRoute || beatCls.includes(KIND_CLASS[wantKind] || wantKind)
    // Screen class alone cannot tell two shots apart: renderWorldSelect and
    // renderChapterSelect both emit `.chapter-select-screen`, so `world` and
    // `chapters` reported an identical `on=[...]` and a swapped or broken
    // shot would have looked fine. A census of the elements that actually
    // differ makes each shot's identity visible in its own verdict line.
    //
    // Counted with the visibility filter, not querySelectorAll: `.beat-equation`
    // sits inside `#teach-content`, which is `display:none` for the whole 합체
    // intro, so the raw count reported `beat-equation=1` on seven shots that
    // had stopped rendering it. A census that counts hidden elements is a
    // census that cannot see the screen change.
    const census = ['.chapter-card', '.stage-node', '.option-btn', '.letter-tile',
      '.beat-equation', '.mini-bot']
      .map((q) => `${q.replace(/[.\s]|-btn|-node|-card|-tile|-bot/g, '')}=${seen(q)}`)
      .filter((s) => !s.endsWith('=0')).join(' ') || 'empty'
    // Text that is being cut off rather than overflowing. `.chapter-card-title
    // .range` sets overflow:hidden + text-overflow:ellipsis, so growing its
    // font past the card width turns "Chapters 22-28" into "Chapters 22-…"
    // while every scroll and gap number stays green. Nothing else in the HUD
    // can see that, so it gets its own field.
    const clipped = Array.from(document.querySelectorAll('#app *'))
      .filter((el) => {
        if (!el.getClientRects().length) return false
        const cs = getComputedStyle(el)
        if (cs.overflowX === 'visible' && cs.overflowY === 'visible') return false
        // .sr-only is a 1px clipping box on purpose (single-letter option
        // tiles hide their text label -- the tile IS the glyph), so it is
        // always "clipped" and would otherwise mask every real clip.
        if (el.classList.contains('sr-only')) return false
        return el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1
      })
      .map((el) => `${el.className || el.tagName}(${el.scrollWidth}>${el.clientWidth})`)
    // Text that spills OUT of its box instead of overflowing the page. The
    // CLIP field above cannot see this: it skips every element whose
    // overflow is `visible`, which is exactly the case where the spill is
    // painted outside the parent. On main today the option labels
    // "orange"/"octopus"/"umbrella" render past both edges of their card and
    // collide with the neighbouring card's word -- a single unbroken word
    // does not wrap, so nothing in the HUD moved. Reported as a child rect
    // wider than the parent's content box, which is the shape of the bug.
    const spill = Array.from(document.querySelectorAll('#app *'))
      .filter((el) => {
        const p = el.parentElement
        if (!p || !el.getClientRects().length) return false
        if (el.classList.contains('sr-only')) return false
        const cs = getComputedStyle(el)
        // Taken out of flow on purpose: the full-bleed flash overlay and the
        // shout-burst speed lines are meant to paint past their parent.
        if (cs.position === 'fixed' || cs.position === 'absolute') return false
        const pcs = getComputedStyle(p)
        if (pcs.overflowX !== 'visible') return false
        return el.getBoundingClientRect().width > contentW(p, pcs) + 2
      })
      .map((el) => `${el.className || el.tagName}(${Math.round(el.getBoundingClientRect().width)}>${Math.round(contentW(el.parentElement, getComputedStyle(el.parentElement)))})`)
    const bv = beatVoid()
    const rg = params.get('rigid') ? rigid() : []
    // An ad-hoc ?iso= run declares itself through wantKind; only the named
    // suite shots are held to the EXPECT table.
    const exp = params.get('iso') ? [] : expectFailures(shot)
    const line = `${verdict}${kindOk ? '' : ' *** WRONG-BEAT'}${
      exp.length ? ` *** EXPECT-FAIL[${exp.join(' ')}]` : ''
    } shot=${params.get('iso') || shot} on=[${screenCls}|${beatCls}] ${census} ${
      clipped.length ? `CLIP=[${clipped.slice(0, 3).join(' ')}] ` : ''
    }${spill.length ? `SPILL=[${spill.slice(0, 3).join(' ')}] ` : ''}vp=${m.vw}x${m.vh} svh=${m.svh} tb=${(m.vw < m.vh ? 1194 : 834) - m.svh} ovfY=${m.overflowY} ovfX=${m.overflowX} gap=${m.gap}px(${m.pct}%)@y${m.gapAt}${
      bv ? ` bgap=${bv.gap}px(${bv.pct}%)@y${bv.at}/col${bv.h}` : ''
    }${m.nat ? ` nat=${m.nat}` : ''}${rg.length ? ` RIGID=${rg.length}[${rg.slice(0, 4).join(' ')}]` : ''}`
    document.title = line
    if (params.get('hud') !== '0') {
      const hud = document.createElement('div')
      hud.setAttribute('style', [
        'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:9999',
        'font:700 20px/1.3 ui-monospace,monospace', 'padding:6px 10px',
        // Red for a wrong screen too, not just for scroll -- the whole reason
        // the *after shots went unnoticed for a round is that a green bar is
        // the only thing anyone reads off a screenshot.
        `background:${verdict === 'SCROLL' || exp.length || !kindOk ? '#e24b4a' : '#3b9922'}`, 'color:#fff',
        'text-align:center', 'pointer-events:none',
      ].join(';'))
      hud.textContent = line
      document.body.appendChild(hud)
    }
    document.documentElement.setAttribute('data-probe', line)
    if (params.get('dbg')) {
      const sel = ['#app', '.screen', '.battle-scene', '.beat-area', '.beat', '.options-grid',
        '.option-btn', '.option-emoji', '.option-emoji svg.word-icon-art', '.option-label', '.beat-instruction', '.map-path', '.stage-node-wrap', '.stage-label', '.map-header',
        '.chapter-grid', '.chapter-card', '.chapter-card-art', '.chapter-card-order', '.chapter-card-title',
        '.boss-intro', '.boss-intro-label', '.boss-intro-robots', '.mini-bot', '.boss-intro-hero', '.boss-intro-skip', '.teach-content', '.beat-avatar', '.big-letter', '.replay-btn', '.primary-btn',
        '.teach-focus', '.beat-equation', '.beat-emoji', '.back-btn', '.nameplate', '.nameplate-name', '.villain-sprite', '.target-word', '.build-slots', '.tile-row', '.secondary-btn',
        // The confirm button sits on the app's tightest portrait margin
        // (bottom edge at 1180 of 1194), so anything that grows below the
        // option grid has to be checked against it.
        '.mic-btn', '#confirm-btn',
        // The reward column is where the star row's 97px went, so its own
        // boxes have to be visible here to see where the space landed.
        '.reward-title', '.reward-scene', '.reward-hero', '.reward-villain', '.reward-bolt', '.reward-line', '.recap-line']
      const rows = sel.map((q) => {
        const el = document.querySelector(q)
        if (!el) return `${q}: -`
        const r = el.getBoundingClientRect()
        const cs = getComputedStyle(el)
        return `${q}: left=${Math.round(r.left)} w=${Math.round(r.width)} top=${Math.round(r.top)} h=${Math.round(r.height)} flex=${cs.flexGrow}/${cs.flexBasis} jc=${cs.justifyContent} disp=${cs.display} fs=${cs.fontSize}`
      })
      document.documentElement.setAttribute('data-dbg', rows.join(' | '))
    }
  }
  run()
</script>
